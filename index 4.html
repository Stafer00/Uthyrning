<!DOCTYPE html>
<html lang="sv">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skiduthyrning Veckovy</title>
<style>
body { font-family: Arial; padding:20px; background:#f4f4f4; }
h1 { text-align:center; }
select,input,button { padding:10px; font-size:14px; margin:5px 0; }
button { background:#1976d2; color:white; border:none; border-radius:6px; }
table { border-collapse: collapse; width:100%; margin-top:20px; }
th, td { border:1px solid #ccc; padding:6px; text-align:center; font-size:12px; }
th { background:#eee; }
.booked { background:#f44336; color:white; }
.return { background:#ff9800; color:white; }
</style>
</head>
<body>

<h1>Skiduthyrning</h1>

<h2>Ny bokning</h2>
<input id="customer" placeholder="Kundnamn">
<select id="category">
<option>Knatte</option>
<option>Junior</option>
<option>Vuxen</option>
</select>
<select id="length"></select>
<label>Start</label>
<input type="date" id="start">
<label>Slut</label>
<input type="date" id="end">
<button onclick="rent()">Boka</button>

<h2>Veckovy</h2>
<input type="date" id="weekPicker" onchange="renderWeek()">
<div id="calendar"></div>

<script>

const inventory = {
90:1,100:3,110:4,120:6,130:8,140:3,150:5,160:5,170:3,
179:7,190:2,192:2,194:7,195:1,197:6,199:5,202:3,204:6,207:3
};

if(!localStorage.rentals){
  localStorage.rentals = JSON.stringify([]);
}

function calculatePrice(cat, days){
  const table = {
    Knatte:[140,220,290,340,380,420,420],
    Junior:[200,290,360,430,500,530,530],
    Vuxen:[280,380,470,550,610,680,680]
  };
  const extra = {Knatte:60, Junior:70, Vuxen:90};
  if(days<=7) return table[cat][days-1];
  return table[cat][6] + (days-7)*extra[cat];
}

function daysBetween(start,end){
  return Math.ceil((new Date(end)-new Date(start))/(1000*60*60*24))+1;
}

function overlaps(aStart,aEnd,bStart,bEnd){
  return (aStart<=bEnd && bStart<=aEnd);
}

function loadInventory(){
  let select=document.getElementById("length");
  select.innerHTML="";
  Object.keys(inventory).sort((a,b)=>a-b).forEach(len=>{
    let opt=document.createElement("option");
    opt.value=len;
    opt.text=len+" cm";
    select.appendChild(opt);
  });
}

function rent(){
  let customer=document.getElementById("customer").value;
  let category=document.getElementById("category").value;
  let length=document.getElementById("length").value;
  let start=document.getElementById("start").value;
  let end=document.getElementById("end").value;

  if(!customer||!start||!end) return alert("Fyll i alla fält");
  if(end<start) return alert("Slutdatum måste vara efter startdatum");

  let rentals=JSON.parse(localStorage.rentals);

  let booked=rentals.filter(r=>
    !r.returned &&
    r.length==length &&
    overlaps(start,end,r.start,r.end)
  ).length;

  if(booked>=inventory[length]){
    return alert("Fullbokat denna period");
  }

  let days=daysBetween(start,end);
  let price=calculatePrice(category,days);

  rentals.push({
    id:Date.now(),
    customer,category,length,start,end,price,returned:false
  });

  localStorage.rentals=JSON.stringify(rentals);

  document.getElementById("customer").value="";
  renderWeek();
}

function getMonday(d){
  d=new Date(d);
  let day=d.getDay();
  let diff=d.getDate()-(day===0?6:day-1);
  return new Date(d.setDate(diff));
}

function formatDate(d){
  return d.toISOString().split("T")[0];
}

function renderWeek(){
  let picker=document.getElementById("weekPicker").value;
  if(!picker) return;

  let monday=getMonday(picker);
  let dates=[];
  for(let i=0;i<7;i++){
    let d=new Date(monday);
    d.setDate(d.getDate()+i);
    dates.push(formatDate(d));
  }

  let rentals=JSON.parse(localStorage.rentals);

  let html="<table><tr><th>Längd</th>";
  dates.forEach(d=> html+="<th>"+d.substring(5)+"</th>");
  html+="</tr>";

  Object.keys(inventory).sort((a,b)=>a-b).forEach(len=>{
    html+="<tr><td>"+len+" cm</td>";
    dates.forEach(date=>{
      let cellClass="";
      rentals.forEach(r=>{
        if(!r.returned && r.length==len && overlaps(date,date,r.start,r.end)){
          cellClass="booked";
          if(date===r.end) cellClass="return";
        }
      });
      html+="<td class='"+cellClass+"'></td>";
    });
    html+="</tr>";
  });

  html+="</table>";
  document.getElementById("calendar").innerHTML=html;
}

function initWeek(){
  let today=new Date();
  let iso=today.toISOString().split("T")[0];
  document.getElementById("weekPicker").value=iso;
  renderWeek();
}

loadInventory();
initWeek();

</script>
</body>
</html>
