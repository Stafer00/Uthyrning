<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lagerhantering</title>

<style>
body{
  font-family:-apple-system, Arial;
  padding:10px;
  background:#f5f5f5;
}

.section{
  background:white;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

input{
  font-size:18px;
  padding:10px;
  width:100%;
  margin:5px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  font-size:16px;
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
  background:#2e7dff;
  color:white;
}

/* 🔥 NY KNAPP */
.backBtn{
  background:#4caf50;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.card{
  border:1px solid #ccc;
  padding:10px;
  border-radius:10px;
  text-align:center;
}
</style>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</head>

<body>

<h2>Lagerhantering</h2>

<!-- 🔥 TILLBAKA -->
<button onclick="window.location.href='/'" class="backBtn">
  ← Till bokning
</button>

<div class="section">

<input id="length" placeholder="Skidlängd (cm)">
<button onclick="addSki()">Lägg till skida</button>

</div>

<div class="section">

<h3>Lager</h3>
<div id="list" class="grid"></div>

</div>

<script>

/* SUPABASE */
const supabaseClient = window.supabase.createClient(
  "https://ycasdixhobiaiizevgsi.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljYXNkaXhob2JpYWlpemV2Z3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzNTMxODksImV4cCI6MjA4ODkyOTE4OX0.KtJFN_RhN8WIIPPYX1TfnyZYCdlhug7SBqYnMALOw2c"
)

let skis=[]

window.onload = load

async function load(){

  const {data,error} = await supabaseClient.from("skis").select("*")

  if(error){
    console.log(error)
    return
  }

  skis = data || []

  render()
}

function render(){

  const div = document.getElementById("list")
  div.innerHTML = ""

  const grouped = {}

  skis.forEach(s=>{
    grouped[s.length] = (grouped[s.length] || 0) + 1
  })

  Object.keys(grouped).sort((a,b)=>a-b).forEach(length=>{

    const el = document.createElement("div")
    el.className = "card"

    el.innerHTML = `
      <strong>${length} cm</strong><br>
      ${grouped[length]} st<br><br>

      <button onclick="addOne(${length})">+1</button>
      <button onclick="removeOne(${length})">-1</button>
    `

    div.appendChild(el)
  })
}

/* ADD */

async function addSki(){

  const length = document.getElementById("length").value

  if(!length){
    alert("Ange längd")
    return
  }

  await supabaseClient.from("skis").insert({
    length:Number(length)
  })

  document.getElementById("length").value=""

  await load()
}

async function addOne(length){

  await supabaseClient.from("skis").insert({length})

  await load()
}

/* REMOVE */

async function removeOne(length){

  const ski = skis.find(s=>s.length==length)

  if(!ski){
    alert("Finns ingen att ta bort")
    return
  }

  await supabaseClient
    .from("skis")
    .delete()
    .eq("id", ski.id)

  await load()
}

</script>

</body>
</html>
