
<!DOCTYPE html>
<html lang="sv">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skiduthyrning</title>

<style>
body{font-family:Arial;padding:20px;background:#f4f4f4}
h1{text-align:center}
input,select,button{padding:8px;margin:4px 0;width:100%}
button{background:#1976d2;color:white;border:none;border-radius:6px}

table{border-collapse:collapse;width:100%;margin-top:10px}
th,td{border:1px solid #ccc;padding:5px;text-align:center}

.card{background:white;padding:10px;margin:10px 0;border-radius:6px}
</style>
</head>

<body>

<h1>Skiduthyrning</h1>

<h2>Ny bokning</h2>

<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">
<label>Startdatum</label>
<input type="date" id="start">

<label>Slutdatum</label>
<input type="date" id="end">
<select id="category"></select>
<select id="length"></select>

<button onclick="addItem()">Lägg till skidor</button>
<button onclick="saveBooking()">Spara bokning</button>

<div id="cart"></div>

<h2>Veckovy</h2>

<button onclick="changeWeek(-1)">⬅</button>
<span id="weeklabel"></span>
<button onclick="changeWeek(1)">➡</button>

<div id="calendar"></div>
<div id="rentals"></div>

<script>

var categories=["Knatte","Junior","Vuxen"]

var inventory={
Knatte:[[90,1],[100,3],[110,4],[120,6]],
Junior:[[130,8],[140,3],[150,5],[160,5]],
Vuxen:[[170,3],[179,7],[190,2],[192,2],[194,7],[195,1],[197,6],[199,5],[202,3],[204,6],[207,3]]
}

var cart=[]

function init(){

var cat=document.getElementById("category")

categories.forEach(function(c){

var o=document.createElement("option")
o.value=c
o.text=c

cat.appendChild(o)

})

cat.onchange=loadLengths

loadLengths()

}

function loadLengths(){

var cat=document.getElementById("category").value

var sel=document.getElementById("length")

sel.innerHTML=""

inventory[cat].forEach(function(i){

var o=document.createElement("option")

o.value=i[0]
o.text=i[0]+" cm"

sel.appendChild(o)

})

}

function addItem(){

var cat=document.getElementById("category").value
var len=document.getElementById("length").value

cart.push({category:cat,length:len})

renderCart()

}

function renderCart(){

var div=document.getElementById("cart")

if(cart.length==0){
div.innerHTML=""
return
}

var html="<table><tr><th>Kategori</th><th>Längd</th></tr>"

cart.forEach(function(i){

html+="<tr><td>"+i.category+"</td><td>"+i.length+"</td></tr>"

})

html+="</table>"

div.innerHTML=html

}

init()
var rentals=[]

function saveBooking(){

var name=document.getElementById("customer").value
var phone=document.getElementById("phone").value
var start=document.getElementById("start").value
var end=document.getElementById("end").value

if(!name||!start||!end||cart.length==0){
alert("Fyll i alla fält")
return
}

rentals.push({
name:name,
phone:phone,
start:start,
end:end,
items:JSON.parse(JSON.stringify(cart))
})

cart=[]
renderCart()

renderRentals()
renderWeek()

}

var name=document.getElementById("customer").value
var phone=document.getElementById("phone").value

if(!name||cart.length==0){
alert("Fyll i namn och välj skidor")
return
}

rentals.push({
name:name,
phone:phone,
items:JSON.parse(JSON.stringify(cart))
})

cart=[]
renderCart()

renderRentals()

}

function renderRentals(){

var div=document.getElementById("rentals")

div.innerHTML=""

rentals.forEach(function(r){

var html="<div class='card'>"

html+="<strong>"+r.name+"</strong> "+r.phone+"<br>"

r.items.forEach(function(i){

html+=i.category+" "+i.length+" cm<br>"

})

html+="</div>"

div.innerHTML+=html

})

}
var weekOffset=0

function changeWeek(n){

weekOffset+=n
renderWeek()

}

function getMonday(d){

d=new Date(d)

var day=d.getDay()

var diff=d.getDate()-(day==0?6:day-1)

return new Date(d.setDate(diff))

}

function renderWeek(){

var base=getMonday(new Date())

base.setDate(base.getDate()+weekOffset*7)

var weeklabel=document.getElementById("weeklabel")

weeklabel.innerHTML=base.toLocaleDateString()

var html="<table><tr><th>Längd</th>"

var days=[]

for(var i=0;i<7;i++){

var d=new Date(base)

d.setDate(base.getDate()+i)

days.push(d)

html+="<th>"+d.getDate()+"</th>"

}

html+="</tr>"

inventory.Vuxen.forEach(function(row){

html+="<tr><td>"+row[0]+"</td>"

days.forEach(function(){

html+="<td>"+row[1]+"</td>"

})

html+="</tr>"

})

html+="</table>"

document.getElementById("calendar").innerHTML=html
renderWeek()
}
</script>

</body>
</html>
