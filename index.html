<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning</title>

<!-- Ingen cache -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<!-- Stil -->
<style>

body {
  font-family: -apple-system, Arial;
  padding: 20px;
  background: #f5f5f5;
}

h1 {
  font-size: 36px;
}

h2 {
  margin-top: 30px;
}

/* Inputs */
input, select, button {
  font-size: 18px;
  padding: 12px;
  margin: 5px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
  width: 100%;
  box-sizing: border-box;
}

/* Knappar */
button {
  background: #2e7dff;
  color: white;
  border: none;
}

button:active {
  opacity: 0.8;
}

/* Sektioner */
.section {
  background: white;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 20px;
}

/* Kalender */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

td, th {
  padding: 6px;
  text-align: center;
}

/* Lager */
.inventory-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.inventory-row button {
  width: auto;
  margin-left: 5px;
}

</style>

<!-- Supabase -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</head>

<body>

<h1>Skiduthyrning</h1>

<!-- ========= NY BOKNING ========= -->
<div class="section">

<h2>Ny bokning</h2>

<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">

<label>Start</label>
<input type="date" id="start">

<label>Slut</label>
<input type="date" id="end">

</div>

<!-- ========= LAGER ========= -->
<div class="section">

<h2>Lager</h2>
<div id="inventory"></div>

</div>

<!-- ========= SKIDOR ========= -->
<div class="section">

<h2>Välj skidor</h2>

<div id="skiWall"></div>

<h3>Valda skidor</h3>
<div id="cart">Inga skidor</div>

<br>

<button id="saveBtn">Spara bokning</button>

</div>

<!-- ========= KALENDER ========= -->
<div class="section">

<h2>Kalender</h2>

<div style="display:flex; gap:10px;">
  <button onclick="prevWeek()">←</button>
  <button onclick="nextWeek()">→</button>
</div>

<br>

<div id="calendar"></div>

</div>

<!-- ========= BOKNINGAR ========= -->
<div class="section">

<h2>Aktiva bokningar</h2>
<div id="rentals"></div>

</div>

<!-- ========= SCRIPT ========= -->
<script src="/app.js?v=10000"></script>

</body>
</html>
