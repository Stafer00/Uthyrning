<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning</title>

<!-- 🔥 STOPPAR ALL CACHE -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body{
  font-family:-apple-system,Arial;
  padding:15px;
  background:#f5f5f5;
}

.section{
  background:white;
  padding:12px;
  border-radius:12px;
  margin-bottom:15px;
}

button{
  font-size:18px;
  padding:12px;
  margin:5px;
  border-radius:10px;
  border:none;
  background:#2e7dff;
  color:white;
}

input{
  font-size:18px;
  padding:12px;
  margin:5px 0;
  width:100%;
  border-radius:10px;
  border:1px solid #ccc;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.card{
  border:1px solid #ccc;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

</style>

<!-- 🔥 SUPABASE -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</head>

<body>

<h2>Skiduthyrning</h2>

<div class="section">

<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">

<label>Start</label>
<input type="date" id="start">

<label>Slut</label>
<input type="date" id="end">

</div>

<div class="section">

<h3>Välj skidor</h3>
<div id="skiWall" class="grid"></div>

<h3>Valt</h3>
<div id="cart"></div>

<button id="saveBtn">Spara bokning</button>

</div>

<div class="section">

<h3>Kalender</h3>

<button onclick="prevWeek()">←</button>
<button onclick="nextWeek()">→</button>

<div id="calendar"></div>

</div>

<div class="section">

<h3>Bokningar</h3>
<div id="rentals"></div>

</div>

<!-- 🔥 CACHE-KILL JS -->
<script>
const version = Date.now()
const script = document.createElement("script")
script.src = "/app.js?v=" + version
document.body.appendChild(script)
</script>

</body>
</html>
