<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning PRO SPA</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{
  margin:0;
  font-family:-apple-system;
  background:#f5f5f5;
}

/* LAYOUT */
.main{
  display:grid;
  grid-template-columns:300px 1fr;
  min-height:100vh;
  gap:10px;
  padding:10px;
}

/* SECTIONS */
.section{
  background:white;
  padding:10px;
  border-radius:10px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:6px;
}

/* CARD */
.card{
  text-align:center;
  padding:6px;
  border-radius:8px;
  font-size:12px;
}

/* BUTTON */
button{
  padding:6px;
  border:none;
  border-radius:6px;
  background:#2e7dff;
  color:white;
}

/* INPUT */
input{
  width:100%;
  padding:6px;
  margin-bottom:6px;
}

/* TABS */
.tabs{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.tab{
  padding:6px 10px;
  background:#ddd;
  border-radius:6px;
}

.tab.active{
  background:#2e7dff;
  color:white;
}

/* VIEWS */
.view{display:none;}
.view.active{display:block;}

table{
  width:100%;
  border-collapse:collapse;
}

td,th{
  padding:4px;
  text-align:center;
}

/* ✅ FIX: popup låg fel tidigare */
.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:flex;
  justify-content:center;
  align-items:center;
}

.popup-box{
  background:white;
  padding:16px;
  border-radius:10px;
  width:90%;
  max-width:400px;
  max-height:80%;
  overflow:auto;
}

</style>

</head>

<body>

<div style="padding:10px">
  <button onclick="showView('booking')">📦 Bokning</button>
  <button onclick="showView('calendar')">📅 Kalender</button>
</div>

<div id="bookingView" class="view active">
<div class="main">

<!-- LEFT -->
<div>

<div class="section">
<h3>Kund</h3>
<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">
<input id="start" type="date">
<input id="end" type="date">
</div>

<div class="section">
<h3>Val</h3>
<div id="cart"></div>
<button id="saveBtn">Spara</button>
</div>

<div class="section">
<h3>Bokningar</h3>
<div id="rentals"></div>
</div>

</div>

<!-- RIGHT -->
<div class="section">
<h3>Utrustning</h3>
<div id="tabs" class="tabs"></div>
<div id="skiWall"></div>
</div>

</div>
</div>

<!-- CALENDAR -->
<div id="calendarView" class="view">
<div class="section">

<h3>Kalender</h3>

<button onclick="prevWeek()">←</button>
<button onclick="nextWeek()">→</button>

<div id="calendar"></div>

</div>
</div>

<script src="app.js"></script>

</body>
</html>
