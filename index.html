<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning</title>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

const supabase = createClient(
"https://ycasdixhobiaiizevgsi.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljYXNkaXhob2JpYWlpemV2Z3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzNTMxODksImV4cCI6MjA4ODkyOTE4OX0.KtJFN_RhN8WIIPPYX1TfnyZYCdlhug7SBqYnMALOw2c"
)

let cart=[]
let rentals=[]
let weekOffset=0

const inventory={
Knatte:{90:1,100:3,110:4,120:6},
Junior:{130:8,140:3,150:5,160:5},
Vuxen:{170:3,179:7,190:2,192:2,194:7,195:1,197:6,199:5,202:3,204:6,207:3}
}

window.addSki=function(){

let cat=document.getElementById("category").value
let len=document.getElementById("length").value
let qty=parseInt(document.getElementById("qty").value)

for(let i=0;i<qty;i++){
cart.push({category:cat,length:len})
}

renderCart()

}

function renderCart(){

let div=document.getElementById("cart")

if(cart.length===0){
div.innerHTML=""
return
}

let html="<table><tr><th>Kategori</th><th>Längd</th></tr>"

cart.forEach(function(s){
html+="<tr><td>"+s.category+"</td><td>"+s.length+" cm</td></tr>"
})

html+="</table>"

div.innerHTML=html

}

window.saveBooking=async function(){

let name=document.getElementById("customer").value
let phone=document.getElementById("phone").value
let start=document.getElementById("start").value
let end=document.getElementById("end").value

if(!name||!start||!end||cart.length===0){
alert("Fyll i alla fält")
return
}

await supabase
.from("rentals")
.insert({
name:name,
phone:phone,
start:start,
end:end,
items:cart,
returned:false
})

cart=[]
renderCart()

loadBookings()

}

async function loadBookings(){

let { data } = await supabase
.from("rentals")
.select("*")
.eq("returned",false)

rentals=data||[]

renderRentals()
renderWeek()

}

window.returnBooking=async function(id){

await supabase
.from("rentals")
.update({returned:true})
.eq("id",id)

loadBookings()

}

function renderRentals(){

let div=document.getElementById("rentals")

div.innerHTML=""

rentals.forEach(function(r){

let html="<div class='card'>"

html+="<strong>"+r.name+"</strong><br>"
html+=r.phone+"<br>"
html+=r.start+" - "+r.end+"<br>"

r.items.forEach(function(it){
html+=it.category+" "+it.length+" cm<br>"
})

html+="<button onclick='returnBooking("+r.id+")'>Återlämnad</button>"
html+="</div>"

div.innerHTML+=html

})

}

function monday(d){

d=new Date(d)
let day=d.getDay()
let diff=d.getDate()-(day===0?6:day-1)

return new Date(d.setDate(diff))

}

function format(d){
return d.toISOString().split("T")[0]
}

window.changeWeek=function(n){
weekOffset+=n
renderWeek()
}

function renderWeek(){

let base=monday(new Date())
base.setDate(base.getDate()+weekOffset*7)

let dates=[]

for(let i=0;i<7;i++){

let d=new Date(base)
d.setDate(base.getDate()+i)

dates.push(format(d))

}

document.getElementById("weeklabel").innerHTML=
dates[0]+" - "+dates[6]

let html=""

for(let cat in inventory){

html+="<table><tr><th>"+cat+"</th>"

dates.forEach(function(d){
html+="<th>"+d.substring(5)+"</th>"
})

html+="</tr>"

for(let len in inventory[cat]){

let total=inventory[cat][len]

html+="<tr><td>"+len+"</td>"

dates.forEach(function(day){

let booked=0

rentals.forEach(function(r){

if(day>=r.start && day<=r.end){

r.items.forEach(function(it){

if(it.category===cat && it.length==len){
booked++
}

})

}

})

let free=total-booked

let color="green"

if(free===0) color="red"
else if(free<=Math.ceil(total/2)) color="orange"

html+="<td style='background:"+color+"'>"+free+"</td>"

})

html+="</tr>"

}

html+="</table><br>"

}

document.getElementById("calendar").innerHTML=html

}

loadBookings()

</script>

<style>

body{font-family:Arial;padding:20px;background:#f4f4f4}

input,select,button{width:100%;padding:8px;margin:4px 0}

button{background:#1976d2;color:white;border:none;border-radius:6px}

table{border-collapse:collapse;width:100%;margin-top:10px;font-size:12px}

th,td{border:1px solid #ccc;padding:5px;text-align:center}

.card{background:white;padding:10px;margin-top:10px;border-radius:6px}

</style>
</head>

<body>

<h1>Skiduthyrning</h1>

<h2>Ny bokning</h2>

<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">

<label>Startdatum</label>
<input type="date" id="start">

<label>Slutdatum</label>
<input type="date" id="end">

<select id="category">
<option>Knatte</option>
<option>Junior</option>
<option>Vuxen</option>
</select>

<select id="length">
<option>90</option>
<option>100</option>
<option>110</option>
<option>120</option>
<option>130</option>
<option>140</option>
<option>150</option>
<option>160</option>
<option>170</option>
<option>179</option>
<option>190</option>
<option>192</option>
<option>194</option>
<option>195</option>
<option>197</option>
<option>199</option>
<option>202</option>
<option>204</option>
<option>207</option>
</select>

<input type="number" id="qty" value="1">

<button onclick="addSki()">Lägg till skidor</button>
<button onclick="saveBooking()">Spara bokning</button>

<div id="cart"></div>

<h2>Veckovy</h2>

<button onclick="changeWeek(-1)">⬅</button>
<span id="weeklabel"></span>
<button onclick="changeWeek(1)">➡</button>

<div id="calendar"></div>

<h2>Aktiva bokningar</h2>

<div id="rentals"></div>

</body>
</html>
