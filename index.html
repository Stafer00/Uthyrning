<!DOCTYPE html>
<html lang="sv">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skiduthyrning PRO Stabil</title>
<style>
body{font-family:Arial;padding:20px;background:#f4f4f4;}
h1{text-align:center;}
input,select,button{padding:8px;margin:4px 0;width:100%;}
button{background:#1976d2;color:white;border:none;border-radius:6px;}
.smallbtn{width:auto;padding:6px 10px;margin:4px;}
table{border-collapse:collapse;width:100%;margin-top:10px;font-size:12px;}
th,td{border:1px solid #ccc;padding:5px;text-align:center;}
th{background:#eee;}
.good{background:#4caf50;color:white;}
.low{background:#ff9800;color:white;}
.full{background:#f44336;color:white;}
.section{background:white;padding:10px;margin-top:15px;border-radius:6px;}
.card{background:white;padding:10px;margin:8px 0;border-radius:6px;}
</style>
</head>
<body>

<h1>Skiduthyrning PRO</h1>

<h2>Ny familjebokning</h2>
<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefonnummer">
<label>Startdatum</label>
<input type="date" id="start">
<label>Slutdatum</label>
<input type="date" id="end">

<h3>Lägg till utrustning</h3>
<select id="category" onchange="loadLengths()">
<option>Knatte</option>
<option>Junior</option>
<option>Vuxen</option>
</select>
<select id="length"></select>
<input type="number" id="quantity" value="1" min="1">
<button class="smallbtn" onclick="addItem()">Lägg till</button>

<div id="cart"></div>
<button onclick="saveBooking()">Spara bokning</button>

<h2>Aktiva bokningar</h2>
<div id="rentals"></div>

<h2>Veckovy (lediga per dag)</h2>
<button class="smallbtn" onclick="changeWeek(-1)">⬅</button>
<strong id="weekLabel"></strong>
<button class="smallbtn" onclick="changeWeek(1)">➡</button>
<div id="calendar"></div>

<h2>Återlämningar denna vecka</h2>
<div id="returnsView"></div>

<script>
const inventory={
Knatte:{90:1,100:3,110:4,120:6},
Junior:{130:8,140:3,150:5,160:5},
Vuxen:{170:3,179:7,190:2,192:2,194:7,195:1,197:6,199:5,202:3,204:6,207:3}
};

if(!localStorage.rentals){localStorage.rentals=JSON.stringify([]);}
let cartItems=[];
let currentMonday=getMonday(new Date());

function getMonday(d){
d=new Date(d);
let day=d.getDay();
let diff=d.getDate()-(day===0?6:day-1);
return new Date(d.setDate(diff));
}

function formatDate(d){
let year=d.getFullYear();
let month=String(d.getMonth()+1).padStart(2,"0");
let day=String(d.getDate()).padStart(2,"0");
return year+"-"+month+"-"+day;
}

function overlaps(aStart,aEnd,bStart,bEnd){
return(aStart<=bEnd&&bStart<=aEnd);
}

function calculatePrice(cat,days){
const table={
Knatte:[140,220,290,340,380,420,420],
Junior:[200,290,360,430,500,530,530],
Vuxen:[280,380,470,550,610,680,680]
};
const extra={Knatte:60,Junior:70,Vuxen:90};
if(days<=7)return table[cat][days-1];
return table[cat][6]+(days-7)*extra[cat];
}

function daysBetween(s,e){
return Math.ceil((new Date(e)-new Date(s))/(1000*60*60*24))+1;
}

function loadLengths(){
let cat=document.getElementById("category").value;
let sel=document.getElementById("length");
sel.innerHTML="";
Object.keys(inventory[cat]).sort((a,b)=>a-b).forEach(len=>{
let o=document.createElement("option");
o.value=len;o.text=len+" cm";sel.appendChild(o);
});
}

function addItem(){
let cat=document.getElementById("category").value;
let len=document.getElementById("length").value;
let qty=parseInt(document.getElementById("quantity").value);
cartItems.push({category:cat,length:len,quantity:qty});
renderCart();
}

function renderCart(){
let div=document.getElementById("cart");
if(cartItems.length===0){div.innerHTML="";return;}
let html="<table><tr><th>Kategori</th><th>Längd</th><th>Antal</th></tr>";
cartItems.forEach(i=>{
html+="<tr><td>"+i.category+"</td><td>"+i.length+"</td><td>"+i.quantity+"</td></tr>";
});
html+="</table>";
div.innerHTML=html;
}

function saveBooking(){
let name=document.getElementById("customer").value;
let phone=document.getElementById("phone").value;
let start=document.getElementById("start").value;
let end=document.getElementById("end").value;
if(!name||!phone||!start||!end||cartItems.length===0){
return alert("Fyll i allt");
}
let rentals=JSON.parse(localStorage.rentals);

for(let item of cartItems){
let booked=rentals.filter(r=>!r.returned&&overlaps(start,end,r.start,r.end))
.flatMap(r=>r.items)
.filter(i=>i.category===item.category&&i.length==item.length)
.reduce((s,i)=>s+i.quantity,0);
if(booked+item.quantity>inventory[item.category][item.length]){
return alert("Fullt: "+item.category+" "+item.length);
}
}

let days=daysBetween(start,end);
let total=0;
let itemsWithPrice=cartItems.map(i=>{
let p=calculatePrice(i.category,days)*i.quantity;
total+=p;return {...i,price:p};
});

rentals.push({id:Date.now(),customer:name,phone,start,end,
items:itemsWithPrice,total,returned:false});

localStorage.rentals=JSON.stringify(rentals);
cartItems=[];
renderCart();loadRentals();renderWeek();
}

function markReturned(id){
let rentals=JSON.parse(localStorage.rentals);
rentals.find(r=>r.id===id).returned=true;
localStorage.rentals=JSON.stringify(rentals);
loadRentals();renderWeek();
}

function loadRentals(){
let rentals=JSON.parse(localStorage.rentals);
let div=document.getElementById("rentals");
div.innerHTML="";
rentals.filter(r=>!r.returned).forEach(r=>{
let html="<div class='card'><strong>"+r.customer+"</strong> ("+r.phone+")<br>";
html+=r.start+" – "+r.end+"<br>";
r.items.forEach(i=>{
html+=i.category+" "+i.length+" x "+i.quantity+"<br>";
});
html+="<br>Total: "+r.total+" kr<br>";
html+="<button onclick='markReturned("+r.id+")'>Återlämnad</button></div>";
div.innerHTML+=html;
});
}

function renderWeek(){
let monday=new Date(currentMonday);
let dates=[];
for(let i=0;i<7;i++){
let d=new Date(monday);
d.setDate(d.getDate()+i);
dates.push(formatDate(d));
}
document.getElementById("weekLabel").innerText=dates[0]+" – "+dates[6];
let rentals=JSON.parse(localStorage.rentals);
let html="";

Object.keys(inventory).forEach(cat=>{
html+="<div class='section'><strong>"+cat+"</strong>";
html+="<table><tr><th>Längd</th>";
dates.forEach(d=>html+="<th>"+d.substring(5)+"</th>");
html+="</tr>";
Object.keys(inventory[cat]).forEach(len=>{
html+="<tr><td>"+len+"</td>";
dates.forEach(date=>{
let booked=rentals.filter(r=>!r.returned&&overlaps(date,date,r.start,r.end))
.flatMap(r=>r.items)
.filter(i=>i.category===cat&&i.length==len)
.reduce((s,i)=>s+i.quantity,0);
let avail=inventory[cat][len]-booked;
let css="good";
if(avail===0)css="full";
else if(avail<=Math.ceil(inventory[cat][len]/2))css="low";
html+="<td class='"+css+"'>"+avail+"</td>";
});
html+="</tr>";
});
html+="</table></div>";
});
document.getElementById("calendar").innerHTML=html;
renderReturns(dates);
}

function renderReturns(dates){
let rentals=JSON.parse(localStorage.rentals);
let html="";
dates.forEach(date=>{
let returns=rentals.filter(r=>!r.returned&&r.end===date);
if(returns.length>0){
html+="<div class='section'><strong>"+date+"</strong><br>";
returns.forEach(r=>{
html+=r.customer+" ("+r.phone+")<br>";
});
html+="</div>";
}
});
if(html==="")html="<div class='section'>Inga återlämningar</div>";
document.getElementById("returnsView").innerHTML=html;
}

function changeWeek(dir){
currentMonday.setDate(currentMonday.getDate()+7*dir);
renderWeek();
}

loadLengths();
loadRentals();
renderWeek();
</script>

</body>
</html>
