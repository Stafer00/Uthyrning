<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning</title>

<!-- STOPPA CACHE -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>

body{
  margin:0;
  font-family:-apple-system, Arial;
  background:#f5f5f5;
  height:100vh;
  overflow:hidden;
}

.container{
  display:flex;
  height:100vh;
  gap:8px;
  padding:8px;
  box-sizing:border-box;
}

.left{
  width:35%;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.right{
  width:65%;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.section{
  background:white;
  border-radius:10px;
  padding:8px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.customer{ flex:0 0 auto; }
.skiSection{ flex:1; }
.calendar{ flex:2; }
.bookings{ flex:1; }

input{
  font-size:14px;
  padding:8px;
  margin:3px 0;
  width:100%;
  border-radius:6px;
  border:1px solid #ccc;
}

button{
  font-size:14px;
  padding:6px 8px;
  margin:2px;
  border:none;
  border-radius:6px;
  background:#2e7dff;
  color:white;
}

.clearBtn{ background:#777; }

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.scroll{
  overflow:auto;
  flex:1;
  min-height:0;
}

.card{
  border:1px solid #ddd;
  border-radius:8px;
  padding:6px;
  text-align:center;
  font-size:12px;
}

#calendar table{
  width:100%;
  height:100%;
  border-collapse:collapse;
}

#calendar th, #calendar td{
  text-align:center;
}

h4{ margin:4px 0; }

</style>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="container">

  <div class="left">

    <div class="section customer">
      <h4>Kund</h4>
      <input id="customer" placeholder="Namn">
      <input id="phone" placeholder="Telefon">
      <input type="date" id="start">
      <input type="date" id="end">
    </div>

    <div class="section skiSection">

      <h4>Skidor</h4>

      <div class="scroll">
        <div id="skiWall" class="grid"></div>
        <div id="cart"></div>
      </div>

      <div>
        <button id="saveBtn">Spara</button>
        <button onclick="clearForm()" class="clearBtn">Rensa</button>
      </div>

    </div>

  </div>

  <div class="right">

    <div class="section calendar">

      <h4>Kalender</h4>

      <div>
        <button onclick="prevWeek()">←</button>
        <button onclick="nextWeek()">→</button>
      </div>

      <div id="calendar"></div>

    </div>

    <div class="section bookings">

      <h4>Bokningar</h4>

      <input id="search" placeholder="Sök..." oninput="filterRentals()">

      <div class="scroll">
        <div id="rentals"></div>
      </div>

    </div>

  </div>

</div>

<!-- 🔥 TOTAL CACHE RESET -->
<script>
(async () => {

  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations()
    for (let r of regs) await r.unregister()
  }

  if ('caches' in window) {
    const keys = await caches.keys()
    for (let k of keys) await caches.delete(k)
  }

  if (!localStorage.getItem("fresh")) {
    localStorage.setItem("fresh", "1")
    location.reload(true)
  }

})()
</script>

<!-- LOAD JS -->
<script>
const script = document.createElement("script")
script.src = "/app.js?v=" + Date.now()
document.body.appendChild(script)
</script>

</body>
</html>
