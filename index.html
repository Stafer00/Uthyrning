<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning 1.7 PRO</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{
  margin:0;
  font-family:-apple-system;
  background:#f5f5f5;
}

.container{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:10px;
  padding:10px;
}

.section{
  background:white;
  padding:12px;
  border-radius:12px;
}

input{
  width:100%;
  padding:8px;
  margin-bottom:6px;
}

button{
  padding:8px;
  margin:4px;
  border:none;
  border-radius:6px;
  background:#2e7dff;
  color:white;
}

.card{
  display:inline-block;
  width:80px;
  margin:4px;
  padding:8px;
  border-radius:8px;
  text-align:center;
}

.booking{
  border:1px solid #ddd;
  padding:6px;
  margin:4px 0;
}

</style>

</head>

<body>

<div class="container">

<!-- LEFT -->
<div>

<div class="section">
<h3>Kund</h3>
<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">
<input id="start" type="date">
<input id="end" type="date">
</div>

<div class="section">
<h3>Bokningar</h3>
<div id="rentals"></div>
</div>

</div>

<!-- RIGHT -->
<div>

<div class="section">
<h3>Utrustning</h3>

<div id="filters"></div>

<div id="skiWall"></div>

<h4>Val</h4>
<div id="cart"></div>

<button id="saveBtn">Spara</button>
<button onclick="cart=[];renderAll()">Rensa</button>
<button onclick="window.location.href='calendar.html'">📅 Kalender</button>

</div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
