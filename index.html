<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test uthyrning</title>

<style>
body{font-family:Arial;padding:20px}
button{padding:10px;margin-top:10px}
.card{border:1px solid #ccc;padding:10px;margin-top:10px}
</style>

</head>
<body>

<h1>Test bokning</h1>

<input id="name" placeholder="Namn">
<button onclick="save()">Spara bokning</button>

<h2>Bokningar</h2>
<div id="list"></div>

<script>

var rentals=[]

function save(){

var name=document.getElementById("name").value

rentals.push({name:name})

render()

}

function render(){

var div=document.getElementById("list")

div.innerHTML=""

rentals.forEach(function(r){

div.innerHTML+=
"<div class='card'>"+r.name+"</div>"

})

}

</script>

</body>
</html>
