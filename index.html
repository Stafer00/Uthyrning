<!DOCTYPE html>
<html lang="sv">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skiduthyrning Familjebokning</title>
<style>
body { font-family: Arial; padding:20px; background:#f4f4f4; }
h1 { text-align:center; }
h2 { margin-top:30px; }
input, select, button { padding:10px; font-size:14px; margin:5px 0; width:100%; }
button { background:#1976d2; color:white; border:none; border-radius:6px; }
.smallbtn { width:auto; margin:5px 5px 5px 0; padding:8px 12px; }
table { border-collapse: collapse; width:100%; margin-top:10px; font-size:12px; }
th, td { border:1px solid #ccc; padding:6px; text-align:center; }
th { background:#eee; }
.card { background:white; padding:10px; margin:8px 0; border-radius:6px; }
</style>
</head>
<body>

<h1>Skiduthyrning – Familjebokning</h1>

<h2>Ny bokning</h2>
<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefonnummer">

<label>Startdatum</label>
<input type="date" id="start">
<label>Slutdatum</label>
<input type="date" id="end">

<h3>Lägg till utrustning</h3>

<select id="category" onchange="loadLengths()">
<option>Knatte</option>
<option>Junior</option>
<option>Vuxen</option>
</select>

<select id="length"></select>
<input type="number" id="quantity" min="1" value="1">

<button class="smallbtn" onclick="addItem()">Lägg till</button>

<div id="cart"></div>

<button onclick="saveBooking()">Spara bokning</button>

<h2>Aktiva bokningar</h2>
<div id="rentals"></div>

<script>

const inventory = {
  Knatte: {90:1,100:3,110:4,120:6},
  Junior: {130:8,140:3,150:5,160:5},
  Vuxen: {170:3,179:7,190:2,192:2,194:7,195:1,197:6,199:5,202:3,204:6,207:3}
};

if(!localStorage.rentals){
  localStorage.rentals = JSON.stringify([]);
}

let cartItems = [];

function overlaps(aStart,aEnd,bStart,bEnd){
  return (aStart<=bEnd && bStart<=aEnd);
}

function calculatePrice(cat, days){
  const table = {
    Knatte:[140,220,290,340,380,420,420],
    Junior:[200,290,360,430,500,530,530],
    Vuxen:[280,380,470,550,610,680,680]
  };
  const extra = {Knatte:60, Junior:70, Vuxen:90};
  if(days<=7) return table[cat][days-1];
  return table[cat][6] + (days-7)*extra[cat];
}

function daysBetween(start,end){
  return Math.ceil((new Date(end)-new Date(start))/(1000*60*60*24))+1;
}

function loadLengths(){
  let category=document.getElementById("category").value;
  let select=document.getElementById("length");
  select.innerHTML="";
  Object.keys(inventory[category]).sort((a,b)=>a-b).forEach(len=>{
    let opt=document.createElement("option");
    opt.value=len;
    opt.text=len+" cm";
    select.appendChild(opt);
  });
}

function addItem(){
  let category=document.getElementById("category").value;
  let length=document.getElementById("length").value;
  let quantity=parseInt(document.getElementById("quantity").value);
  cartItems.push({category,length,quantity});
  renderCart();
}

function renderCart(){
  let div=document.getElementById("cart");
  if(cartItems.length===0){
    div.innerHTML="";
    return;
  }
  let html="<table><tr><th>Kategori</th><th>Längd</th><th>Antal</th></tr>";
  cartItems.forEach(item=>{
    html+="<tr><td>"+item.category+"</td><td>"+item.length+"</td><td>"+item.quantity+"</td></tr>";
  });
  html+="</table>";
  div.innerHTML=html;
}

function saveBooking(){
  let customer=document.getElementById("customer").value;
  let phone=document.getElementById("phone").value;
  let start=document.getElementById("start").value;
  let end=document.getElementById("end").value;

  if(!customer||!phone||!start||!end||cartItems.length===0){
    return alert("Fyll i allt och lägg till utrustning");
  }

  let rentals=JSON.parse(localStorage.rentals);

  for(let item of cartItems){
    let booked=rentals.filter(r=>
      !r.returned &&
      r.category===item.category &&
      r.length==item.length &&
      overlaps(start,end,r.start,r.end)
    ).reduce((sum,r)=>sum+r.quantity,0);

    if(booked+item.quantity>inventory[item.category][item.length]){
      return alert("Inte tillräckligt lediga: "+item.category+" "+item.length+" cm");
    }
  }

  let days=daysBetween(start,end);
  let totalPrice=0;

  let itemsWithPrice=cartItems.map(item=>{
    let price=calculatePrice(item.category,days)*item.quantity;
    totalPrice+=price;
    return {...item,price};
  });

  rentals.push({
    id:Date.now(),
    customer,phone,start,end,items:itemsWithPrice,totalPrice,returned:false
  });

  localStorage.rentals=JSON.stringify(rentals);

  cartItems=[];
  renderCart();
  loadRentals();
}

function markReturned(id){
  let rentals=JSON.parse(localStorage.rentals);
  rentals.find(r=>r.id===id).returned=true;
  localStorage.rentals=JSON.stringify(rentals);
  loadRentals();
}

function loadRentals(){
  let rentals=JSON.parse(localStorage.rentals);
  let div=document.getElementById("rentals");
  div.innerHTML="";
  rentals.filter(r=>!r.returned).forEach(r=>{
    let html="<div class='card'><strong>"+r.customer+"</strong> ("+r.phone+")<br>";
    html+=r.start+" – "+r.end+"<br><br>";
    r.items.forEach(i=>{
      html+=i.category+" "+i.length+" cm x "+i.quantity+"<br>";
    });
    html+="<br>Total: "+r.totalPrice+" kr<br>";
    html+="<button onclick='markReturned("+r.id+")'>Återlämnad</button></div>";
    div.innerHTML+=html;
  });
}

loadLengths();
loadRentals();

</script>
</body>
</html>
