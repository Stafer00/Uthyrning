<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning</title>

<!-- 🔥 STOPPA CACHE -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body{
  font-family:-apple-system, Arial;
  padding:12px;
  background:#f5f5f5;
}

h2{
  margin-bottom:10px;
}

/* SECTIONS */
.section{
  background:white;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
}

/* INPUT */
input{
  font-size:16px;
  padding:10px;
  margin:5px 0;
  width:100%;
  border-radius:10px;
  border:1px solid #ccc;
}

/* BUTTON */
button{
  font-size:16px;
  padding:10px 12px;
  margin:4px;
  border-radius:10px;
  border:none;
  background:#2e7dff;
  color:white;
}

/* 🔥 5 KOLUMNER */
.grid{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:8px;
}

/* KORT */
.card{
  border:1px solid #ddd;
  padding:8px;
  border-radius:10px;
  text-align:center;
  background:#fff;
}

/* KNAPPAR */
.card button{
  font-size:16px;
  padding:6px 8px;
  margin:4px;
  width:40px;
}

/* KALENDER */
#calendar table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

#calendar th, #calendar td{
  padding:5px;
  text-align:center;
  font-size:12px;
}

</style>

<!-- SUPABASE -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</head>

<body>

<h2>Skiduthyrning</h2>

<!-- BOKNING -->
<div class="section">

<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">

<label>Start</label>
<input type="date" id="start">

<label>Slut</label>
<input type="date" id="end">

</div>

<!-- SKIDOR -->
<div class="section">

<h3>Välj skidor</h3>
<div id="skiWall" class="grid"></div>

<h3>Valda</h3>
<div id="cart"></div>

<button id="saveBtn">Spara bokning</button>

</div>

<!-- KALENDER -->
<div class="section">

<h3>Kalender</h3>

<div style="display:flex;gap:8px;">
  <button onclick="prevWeek()">←</button>
  <button onclick="nextWeek()">→</button>
</div>

<div id="calendar"></div>

</div>

<!-- BOKNINGAR -->
<div class="section">

<h3>Bokningar</h3>
<div id="rentals"></div>

</div>

<!-- 🔥 RENSAR SERVICE WORKER -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister())
  })
}
</script>

<!-- 🔥 LADDAR NYASTE JS + AUTO-RELOAD -->
<script>
const version = Date.now()

const script = document.createElement("script")
script.src = "/app.js?v=" + version
document.body.appendChild(script)

if (!sessionStorage.getItem("reloaded")) {
  sessionStorage.setItem("reloaded", "true")
  location.reload()
}
</script>

</body>
</html>
