<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning PRO iPad</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{
  margin:0;
  font-family:-apple-system;
  background:#f5f5f5;
}

/* LAYOUT */
.main{
  display:grid;
  grid-template-columns:300px 1fr;
  height:100vh;
  gap:10px;
  padding:10px;
  box-sizing:border-box;
}

/* LEFT */
.left{
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* RIGHT */
.right{
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* BOX */
.section{
  background:white;
  padding:10px;
  border-radius:10px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:6px;
}

/* CARD */
.card{
  text-align:center;
  padding:6px;
  border-radius:8px;
  font-size:12px;
}

/* BUTTON */
button{
  padding:6px;
  border:none;
  border-radius:6px;
  background:#2e7dff;
  color:white;
}

/* INPUT */
input{
  width:100%;
  padding:6px;
  margin-bottom:6px;
}

/* TABS */
.tabs{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.tab{
  padding:6px 10px;
  background:#ddd;
  border-radius:6px;
  cursor:pointer;
}

.tab.active{
  background:#2e7dff;
  color:white;
}

</style>

</head>

<body>

<div class="main">

<!-- LEFT -->
<div class="left">

<div class="section">
<h3>Kund</h3>
<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">
<input id="start" type="date">
<input id="end" type="date">
</div>

<div class="section">
<h3>Val</h3>
<div id="cart"></div>
<div id="total"></div>
<button id="saveBtn">Spara</button>
<button onclick="cart=[];render()">Rensa</button>
</div>

<div class="section">
<button onclick="window.location.href='calendar.html'">
📅 Kalender
</button>
</div>

<div class="section">
<h3>Bokningar</h3>
<div id="rentals"></div>
</div>

</div>

<!-- RIGHT -->
<div class="right">

<div class="section">
<h3>Utrustning</h3>

<div id="tabs" class="tabs"></div>
<div id="skiWall"></div>

</div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
