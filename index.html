<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning</title>

<!-- STOPPA CACHE -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body{
  font-family:-apple-system, Arial;
  padding:10px;
  background:#f5f5f5;
}

/* SECTIONS */
.section{
  background:white;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

/* INPUT */
input{
  font-size:16px;
  padding:10px;
  margin:4px 0;
  width:100%;
  border-radius:8px;
  border:1px solid #ccc;
}

/* BUTTON */
button{
  font-size:14px;
  padding:6px 8px;
  margin:3px;
  border-radius:8px;
  border:none;
  background:#2e7dff;
  color:white;
}

/* 🔥 5 KOLUMNER – FUNKAR ALLTID */
.grid{
  display:grid;
  grid-template-columns:repeat(5, minmax(0, 1fr));
  gap:6px;
}

/* 🔥 KRITISK FIX */
.card{
  width:100%;
  box-sizing:border-box;
  border:1px solid #ddd;
  padding:6px;
  border-radius:10px;
  text-align:center;
  background:#fff;
  font-size:12px;
}

/* RUBRIK */
.card h4{
  margin:2px 0;
  font-size:13px;
}

/* ANTAL */
.count{
  font-size:14px;
  margin:2px 0;
}

/* KNAPPAR */
.controls{
  display:flex;
  justify-content:center;
  gap:4px;
}

.card button{
  width:28px;
  height:28px;
  font-size:14px;
  padding:0;
}

/* KALENDER */
#calendar table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

#calendar th, #calendar td{
  padding:4px;
  font-size:11px;
  text-align:center;
}
</style>

<!-- SUPABASE -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</head>

<body>

<h3>Skiduthyrning</h3>

<!-- BOKNING -->
<div class="section">
<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">

<label>Start</label>
<input type="date" id="start">

<label>Slut</label>
<input type="date" id="end">
</div>

<!-- SKIDOR -->
<div class="section">

<h4>Välj skidor</h4>
<div id="skiWall" class="grid"></div>

<h4>Valda</h4>
<div id="cart"></div>

<button id="saveBtn">Spara bokning</button>

</div>

<!-- KALENDER -->
<div class="section">

<h4>Kalender</h4>

<button onclick="prevWeek()">←</button>
<button onclick="nextWeek()">→</button>

<div id="calendar"></div>

</div>

<!-- BOKNINGAR -->
<div class="section">

<h4>Bokningar</h4>
<div id="rentals"></div>

</div>

<!-- RENSAR SERVICE WORKERS -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister())
  })
}
</script>

<!-- CACHE KILL -->
<script>
const script = document.createElement("script")
script.src = "/app.js?v=" + Date.now()
document.body.appendChild(script)

if (!sessionStorage.getItem("reloaded")) {
  sessionStorage.setItem("reloaded", "true")
  location.reload()
}
</script>

</body>
</html>
