
<!DOCTYPE html>
<html lang="sv">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skiduthyrning</title>
<style>
body{font-family:Arial;padding:20px;background:#f4f4f4;}
h1{text-align:center;}
h2{margin-top:30px;}
input,select,button{padding:8px;margin:4px 0;width:100%;}
button{background:#1976d2;color:white;border:none;border-radius:6px;}
.smallbtn{width:auto;padding:4px 8px;margin:4px;}
.deletebtn{background:#d32f2f;}
.navbtn{width:auto;padding:6px 12px;margin:4px;background:#555;}
table{border-collapse:collapse;width:100%;margin-top:10px;font-size:12px;}
th,td{border:1px solid #ccc;padding:5px;text-align:center;}
th{background:#eee;}
.section{background:white;padding:10px;margin-top:15px;border-radius:6px;}
.card{background:white;padding:10px;margin:8px 0;border-radius:6px;}
.returned{color:#999;text-decoration:line-through;}
.good{background:#4caf50;color:white;}
.low{background:#ff9800;color:white;}
.full{background:#f44336;color:white;}
.today{background:#ffe082;}
.center{text-align:center;}
</style>
</head>
<body>

<h1>Skiduthyrning</h1>

<h2>Ny bokning</h2>
<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">
<label>Startdatum</label>
<input type="date" id="start">
<label>Slutdatum</label>
<input type="date" id="end">

<select id="category" onchange="loadLengths()"></select>
<select id="length"></select>

<button onclick="addItem()">Lägg till</button>

<div id="cart"></div>
<button onclick="saveBooking()">Spara bokning</button>

<h2>Aktiva bokningar</h2>
<div id="rentals"></div>

<h2>Återlämningar idag</h2>
<div id="returns"></div>

<h2>Veckovy</h2>
<div class="center">
<button class="navbtn" onclick="changeWeek(-1)">⬅ Föregående</button>
<span id="weeklabel"></span>
<button class="navbtn" onclick="changeWeek(1)">Nästa ➡</button>
</div>
<div id="calendar"></div>

<h2>Utrustning</h2>
<div id="inventoryEditor"></div>

<script>

var categories=["Knatte","Junior","Vuxen"];
var weekOffset=0;

var defaultInventory={
"Knatte":[[90,1],[100,3],[110,4],[120,6]],
"Junior":[[130,8],[140,3],[150,5],[160,5]],
"Vuxen":[
[170,3],[179,7],[190,2],[192,2],[194,7],[195,1],
[197,6],[199,5],[202,3],[204,6],[207,3]
]
};

function getInventory(){
let d=localStorage.getItem("inventory");
if(!d){
localStorage.setItem("inventory",JSON.stringify(defaultInventory));
return JSON.parse(JSON.stringify(defaultInventory));
}
return JSON.parse(d);
}

function saveInventory(inv){
localStorage.setItem("inventory",JSON.stringify(inv));
}

function safeRentals(){
let d=localStorage.getItem("rentals");
if(!d) return [];
return JSON.parse(d);
}

function setRentals(r){
localStorage.setItem("rentals",JSON.stringify(r));
}

function formatDate(d){
let y=d.getFullYear();
let m=("0"+(d.getMonth()+1)).slice(-2);
let da=("0"+d.getDate()).slice(-2);
return y+"-"+m+"-"+da;
}

function getMonday(d){
d=new Date(d);
let day=d.getDay();
let diff=d.getDate() - (day==0?6:day-1);
return new Date(d.setDate(diff));
}

function getWeekNumber(d){
d=new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
let yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
}

function initCategories(){
let sel=document.getElementById("category");
categories.forEach(c=>{
let o=document.createElement("option");
o.value=c;
o.text=c;
sel.appendChild(o);
});
loadLengths();
}

function loadLengths(){
let cat=document.getElementById("category").value;
let inv=getInventory();
let sel=document.getElementById("length");
sel.innerHTML="";
(inv[cat]||[]).forEach(i=>{
let o=document.createElement("option");
o.value=i[0];
o.text=i[0]+" cm";
sel.appendChild(o);
});
}

var cartItems=[];

function addItem(){
let cat=document.getElementById("category").value;
let len=document.getElementById("length").value;
cartItems.push({category:cat,length:len,returned:false});
renderCart();
}

function renderCart(){
let div=document.getElementById("cart");
if(cartItems.length==0){div.innerHTML="";return;}
let html="<table><tr><th>Kategori</th><th>Längd</th></tr>";
cartItems.forEach(i=>{
html+="<tr><td>"+i.category+"</td><td>"+i.length+"</td></tr>";
});
html+="</table>";
div.innerHTML=html;
}

function saveBooking(){

let name=document.getElementById("customer").value;
let phone=document.getElementById("phone").value;
let start=document.getElementById("start").value;
let end=document.getElementById("end").value;

if(!name||!phone||!start||!end||cartItems.length==0){
alert("Fyll i allt");
return;
}

let rentals=safeRentals();
rentals.push({
id:Date.now(),
customer:name,
phone:phone,
start:start,
end:end,
items:cartItems.slice()
});

setRentals(rentals);

cartItems=[];
renderCart();
document.getElementById("customer").value="";
document.getElementById("phone").value="";

loadAll();
}

function returnItem(b,i){
let r=safeRentals();
r.forEach(x=>{
if(x.id==b && x.items[i]) x.items[i].returned=true;
});
setRentals(r);
loadAll();
}

function deleteBooking(b){
let r=safeRentals().filter(x=>x.id!=b);
setRentals(r);
loadAll();
}

function loadRentals(){

let rentals=safeRentals();
let div=document.getElementById("rentals");
div.innerHTML="";

rentals.forEach(r=>{

let allReturned=true;
r.items.forEach(i=>{if(!i.returned) allReturned=false});

let html="<div class='card'><strong>"+r.customer+"</strong> ("+r.phone+")<br>"+r.start+" – "+r.end+"<br>";

r.items.forEach((it,i)=>{

if(it.returned){
html+="<span class='returned'>"+it.category+" "+it.length+" cm</span><br>";
}else{
html+=it.category+" "+it.length+" cm <button onclick='returnItem("+r.id+","+i+")'>Återlämna</button><br>";
}

});

if(allReturned){
html+="<button class='deletebtn' onclick='deleteBooking("+r.id+")'>Ta bort bokning</button>";
}

html+="</div>";

div.innerHTML+=html;

});

}

function renderReturns(){

let today=formatDate(new Date());
let rentals=safeRentals();
let div=document.getElementById("returns");

let html="";

rentals.forEach(r=>{
if(r.end==today){
html+="<div class='card today'><strong>"+r.customer+"</strong> lämnar tillbaka idag</div>";
}
});

if(html=="") html="<div class='card'>Inga återlämningar idag</div>";

div.innerHTML=html;

}

function overlaps(aStart,aEnd,bStart,bEnd){
return (aStart<=bEnd && bStart<=aEnd);
}

function renderWeek(){

let base=getMonday(new Date());
base.setDate(base.getDate()+weekOffset*7);

let week=getWeekNumber(base);
let end=new Date(base); end.setDate(base.getDate()+6);

document.getElementById("weeklabel").innerHTML="Vecka "+week+" ("+formatDate(base)+" – "+formatDate(end)+")";

let dates=[];
for(let i=0;i<7;i++){
let d=new Date(base);
d.setDate(base.getDate()+i);
dates.push(formatDate(d));
}

let rentals=safeRentals();
let inv=getInventory();

let html="";

categories.forEach(cat=>{

html+="<div class='section'><strong>"+cat+"</strong>";
html+="<table><tr><th>Längd</th>";

dates.forEach(d=>{
html+="<th>"+d.substring(5)+"</th>";
});

html+="</tr>";

(inv[cat]||[]).forEach(row=>{

let len=row[0];
let total=row[1];

html+="<tr><td>"+len+"</td>";

dates.forEach(day=>{

let booked=0;

rentals.forEach(r=>{

if(overlaps(day,day,r.start,r.end)){

r.items.forEach(it=>{
if(!it.returned && it.category==cat && it.length==len){
booked++;
}
});

}

});

let available=total-booked;

let css="good";
if(available==0) css="full";
else if(available<=Math.ceil(total/2)) css="low";

html+="<td class='"+css+"'>"+available+"</td>";

});

html+="</tr>";

});

html+="</table></div>";

});

document.getElementById("calendar").innerHTML=html;

}

function changeWeek(o){
weekOffset+=o;
renderWeek();
}

function renderInventoryEditor(){

let inv=getInventory();
let div=document.getElementById("inventoryEditor");

let html="";

categories.forEach(cat=>{

html+="<div class='section'><strong>"+cat+"</strong>";
html+="<table><tr><th>Längd</th><th>Antal</th></tr>";

inv[cat].forEach((r,i)=>{

html+="<tr>";
html+="<td>"+r[0]+" cm</td>";
html+="<td><input type='number' value='"+r[1]+"' onchange='updateInventory(""+cat+"","+i+",this.value)'></td>";
html+="</tr>";

});

html+="</table></div>";

});

div.innerHTML=html;

}

function updateInventory(cat,i,val){

let inv=getInventory();
inv[cat][i][1]=parseInt(val);
saveInventory(inv);
renderWeek();

}

function loadAll(){
loadRentals();
renderReturns();
renderWeek();
renderInventoryEditor();
}

initCategories();
loadAll();

</script>

</body>
</html>
