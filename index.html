<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skiduthyrning</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{font-family:Arial;padding:20px;background:#f4f4f4}

h1{text-align:center}

input,select,button{
width:100%;
padding:8px;
margin:4px 0
}

button{
background:#1976d2;
color:white;
border:none;
border-radius:6px
}

table{
border-collapse:collapse;
width:100%;
margin-top:10px;
font-size:12px
}

th,td{
border:1px solid #ccc;
padding:5px;
text-align:center
}

.card{
background:white;
padding:10px;
margin-top:10px;
border-radius:6px
}

.good{background:#4caf50;color:white}
.low{background:#ff9800;color:white}
.full{background:#f44336;color:white}
.return{background:#2196f3;color:white}

.day{cursor:pointer;text-decoration:underline}

</style>
</head>

<body>

<h1>Skiduthyrning</h1>

<h2>Ny bokning</h2>

<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">

<label>Startdatum</label>
<input type="date" id="start">

<label>Slutdatum</label>
<input type="date" id="end">

<select id="category">
<option>Knatte</option>
<option>Junior</option>
<option>Vuxen</option>
</select>

<select id="length">
<option>90</option>
<option>100</option>
<option>110</option>
<option>120</option>
<option>130</option>
<option>140</option>
<option>150</option>
<option>160</option>
<option>170</option>
<option>179</option>
<option>190</option>
<option>192</option>
<option>194</option>
<option>195</option>
<option>197</option>
<option>199</option>
<option>202</option>
<option>204</option>
<option>207</option>
</select>

<input type="number" id="qty" value="1" min="1">

<button onclick="addSki()">Lägg till skidor</button>
<button onclick="saveBooking()">Spara bokning</button>

<div id="cart"></div>

<h2>Aktiva bokningar</h2>
<div id="rentals"></div>

<script>

const supabase = window.supabase.createClient(
"https://ycasdixhobiaiizevgsi.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljYXNkaXhob2JpYWlpemV2Z3NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzNTMxODksImV4cCI6MjA4ODkyOTE4OX0.KtJFN_RhN8WIIPPYX1TfnyZYCdlhug7SBqYnMALOw2c"
)

var cart=[]
var rentals=[]

function addSki(){

var cat=document.getElementById("category").value
var len=document.getElementById("length").value
var qty=parseInt(document.getElementById("qty").value)

for(var i=0;i<qty;i++){

cart.push({category:cat,length:len})

}

renderCart()

}

function renderCart(){

var div=document.getElementById("cart")

if(cart.length===0){
div.innerHTML=""
return
}

var html="<table><tr><th>Kategori</th><th>Längd</th></tr>"

cart.forEach(function(s){

html+="<tr><td>"+s.category+"</td><td>"+s.length+" cm</td></tr>"

})

html+="</table>"

div.innerHTML=html

}

async function saveBooking(){

var name=document.getElementById("customer").value
var phone=document.getElementById("phone").value
var start=document.getElementById("start").value
var end=document.getElementById("end").value

if(!name||!start||!end||cart.length===0){

alert("Fyll i alla fält")
return

}

await supabase.from("rentals").insert({
name:name,
phone:phone,
start:start,
end:end,
items:cart,
returned:false
})

cart=[]
renderCart()

loadBookings()

}

async function loadBookings(){

let { data } = await supabase
.from("rentals")
.select("*")
.eq("returned",false)

rentals=data

renderRentals()

}

function renderRentals(){

var div=document.getElementById("rentals")

div.innerHTML=""

rentals.forEach(function(r){

var html="<div class='card'>"

html+="<strong>"+r.name+"</strong> "+r.phone+"<br>"
html+=r.start+" - "+r.end+"<br>"

r.items.forEach(function(it){

html+=it.category+" "+it.length+" cm<br>"

})

html+="</div>"

div.innerHTML+=html

})

}

loadBookings()

</script>

</body>
</html>
