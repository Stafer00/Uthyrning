<!DOCTYPE html>
<html lang="sv">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skiduthyrning MAX Stabil</title>
<style>
body{font-family:Arial;padding:20px;background:#f4f4f4;}
h1{text-align:center;}
input,select,button{padding:8px;margin:4px 0;width:100%;}
button{background:#1976d2;color:white;border:none;border-radius:6px;}
.smallbtn{width:auto;padding:6px 10px;margin:4px;}
table{border-collapse:collapse;width:100%;margin-top:10px;font-size:12px;}
th,td{border:1px solid #ccc;padding:5px;text-align:center;}
th{background:#eee;}
.good{background:#4caf50;color:white;}
.low{background:#ff9800;color:white;}
.full{background:#f44336;color:white;}
.section{background:white;padding:10px;margin-top:15px;border-radius:6px;}
.card{background:white;padding:10px;margin:8px 0;border-radius:6px;}
</style>
</head>
<body>

<h1>Skiduthyrning</h1>

<h2>Ny familjebokning</h2>
<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefonnummer">
<label>Startdatum</label>
<input type="date" id="start">
<label>Slutdatum</label>
<input type="date" id="end">

<h3>Lägg till utrustning</h3>
<select id="category"></select>
<select id="length"></select>
<input type="number" id="quantity" value="1" min="1">
<button onclick="addItem()">Lägg till rad</button>

<div id="cart"></div>
<button onclick="saveBooking()">Spara bokning</button>

<h2>Aktiva bokningar</h2>
<div id="rentals"></div>

<h2>Veckovy</h2>
<button onclick="changeWeek(-1)">⬅</button>
<strong id="weekLabel"></strong>
<button onclick="changeWeek(1)">➡</button>
<div id="calendar"></div>

<script>

var categories = ["Knatte","Junior","Vuxen"];

var inventory = {
"Knatte":[[90,1],[100,3],[110,4],[120,6]],
"Junior":[[130,8],[140,3],[150,5],[160,5]],
"Vuxen":[[170,3],[179,7],[190,2],[192,2],[194,7],[195,1],[197,6],[199,5],[202,3],[204,6],[207,3]]
};

if(!localStorage.rentals){localStorage.rentals="[]";}

var cartItems=[];
var currentMonday=getMonday(new Date());

function getMonday(d){
var date=new Date(d);
var day=date.getDay();
var diff=date.getDate()-(day===0?6:day-1);
return new Date(date.setDate(diff));
}

function formatDate(d){
var y=d.getFullYear();
var m=("0"+(d.getMonth()+1)).slice(-2);
var da=("0"+d.getDate()).slice(-2);
return y+"-"+m+"-"+da;
}

function overlaps(aStart,aEnd,bStart,bEnd){
return (aStart<=bEnd && bStart<=aEnd);
}

function initCategories(){
var catSel=document.getElementById("category");
for(var i=0;i<categories.length;i++){
var o=document.createElement("option");
o.value=categories[i];
o.text=categories[i];
catSel.appendChild(o);
}
catSel.onchange=loadLengths;
loadLengths();
}

function loadLengths(){
var cat=document.getElementById("category").value;
var sel=document.getElementById("length");
sel.innerHTML="";
var arr=inventory[cat];
for(var i=0;i<arr.length;i++){
var o=document.createElement("option");
o.value=arr[i][0];
o.text=arr[i][0]+" cm";
sel.appendChild(o);
}
}

function addItem(){
var cat=document.getElementById("category").value;
var len=document.getElementById("length").value;
var qty=parseInt(document.getElementById("quantity").value);
cartItems.push({category:cat,length:len,quantity:qty,returned:false});
renderCart();
}

function renderCart(){
var div=document.getElementById("cart");
if(cartItems.length===0){div.innerHTML="";return;}
var html="<table><tr><th>Kategori</th><th>Längd</th><th>Antal</th></tr>";
for(var i=0;i<cartItems.length;i++){
html+="<tr><td>"+cartItems[i].category+"</td><td>"+cartItems[i].length+"</td><td>"+cartItems[i].quantity+"</td></tr>";
}
html+="</table>";
div.innerHTML=html;
}

function saveBooking(){
var name=document.getElementById("customer").value;
var phone=document.getElementById("phone").value;
var start=document.getElementById("start").value;
var end=document.getElementById("end").value;

if(!name||!phone||!start||!end||cartItems.length===0){
alert("Fyll i allt");
return;
}

var rentals=JSON.parse(localStorage.rentals);
rentals.push({id:Date.now(),customer:name,phone:phone,start:start,end:end,items:cartItems});
localStorage.rentals=JSON.stringify(rentals);

cartItems=[];
renderCart();
loadRentals();
renderWeek();
}

function markReturned(bookingId,itemIndex){
var rentals=JSON.parse(localStorage.rentals);
for(var i=0;i<rentals.length;i++){
if(rentals[i].id===bookingId){
rentals[i].items[itemIndex].returned=true;
}
}
localStorage.rentals=JSON.stringify(rentals);
loadRentals();
renderWeek();
}

function loadRentals(){
var rentals=JSON.parse(localStorage.rentals);
var div=document.getElementById("rentals");
div.innerHTML="";
for(var i=0;i<rentals.length;i++){
var r=rentals[i];
var html="<div class='card'><strong>"+r.customer+"</strong> ("+r.phone+")<br>"+r.start+" – "+r.end+"<br><br>";
for(var j=0;j<r.items.length;j++){
var it=r.items[j];
if(!it.returned){
html+=it.category+" "+it.length+" x "+it.quantity+" ";
html+="<button onclick='markReturned("+r.id+","+j+")'>Återlämna</button><br>";
}
}
html+="</div>";
div.innerHTML+=html;
}
}

function renderWeek(){
var monday=new Date(currentMonday);
var dates=[];
for(var i=0;i<7;i++){
var d=new Date(monday);
d.setDate(d.getDate()+i);
dates.push(formatDate(d));
}
document.getElementById("weekLabel").innerText=dates[0]+" – "+dates[6];

var rentals=JSON.parse(localStorage.rentals);
var html="";

for(var c=0;c<categories.length;c++){
var cat=categories[c];
html+="<div class='section'><strong>"+cat+"</strong>";
html+="<table><tr><th>Längd</th>";
for(var d=0;d<dates.length;d++){
html+="<th>"+dates[d].substring(5)+"</th>";
}
html+="</tr>";

var arr=inventory[cat];
for(var l=0;l<arr.length;l++){
var len=arr[l][0];
var total=arr[l][1];
html+="<tr><td>"+len+"</td>";

for(var d=0;d<dates.length;d++){
var booked=0;

for(var r=0;r<rentals.length;r++){
var rental=rentals[r];
for(var j=0;j<rental.items.length;j++){
var it=rental.items[j];
if(!it.returned && it.category===cat && it.length==len && overlaps(dates[d],dates[d],rental.start,rental.end)){
booked+=it.quantity;
}
}
}

var available=total-booked;
var css="good";
if(available===0)css="full";
else if(available<=Math.ceil(total/2))css="low";

html+="<td class='"+css+"'>"+available+"</td>";
}

html+="</tr>";
}

html+="</table></div>";
}

document.getElementById("calendar").innerHTML=html;
}

function changeWeek(dir){
currentMonday.setDate(currentMonday.getDate()+7*dir);
renderWeek();
}

initCategories();
loadRentals();
renderWeek();

</script>
</body>
</html>
