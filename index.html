<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skiduthyrning PRO</title>

<style>

body{font-family:Arial;padding:20px;background:#f4f4f4}

h1{text-align:center}

input,select,button{
width:100%;
padding:8px;
margin:4px 0
}

button{
background:#1976d2;
color:white;
border:none;
border-radius:6px
}

table{
border-collapse:collapse;
width:100%;
margin-top:10px;
font-size:12px
}

th,td{
border:1px solid #ccc;
padding:5px;
text-align:center
}

.card{
background:white;
padding:10px;
margin-top:10px;
border-radius:6px
}

.good{background:#4caf50;color:white}
.low{background:#ff9800;color:white}
.full{background:#f44336;color:white}
.return{background:#2196f3;color:white}

.day{cursor:pointer;text-decoration:underline}

</style>
</head>

<body>

<h1>Skiduthyrning</h1>

<h2>Ny bokning</h2>

<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">

<label>Startdatum</label>
<input type="date" id="start">

<label>Slutdatum</label>
<input type="date" id="end">

<select id="category">
<option>Knatte</option>
<option>Junior</option>
<option>Vuxen</option>
</select>

<select id="length">
<option>90</option>
<option>100</option>
<option>110</option>
<option>120</option>
<option>130</option>
<option>140</option>
<option>150</option>
<option>160</option>
<option>170</option>
<option>179</option>
<option>190</option>
<option>192</option>
<option>194</option>
<option>195</option>
<option>197</option>
<option>199</option>
<option>202</option>
<option>204</option>
<option>207</option>
</select>

<button onclick="addSki()">Lägg till skidor</button>
<button onclick="saveBooking()">Spara bokning</button>

<div id="cart"></div>

<h2>Veckovy</h2>

<button onclick="changeWeek(-1)">⬅</button>
<span id="weeklabel"></span>
<button onclick="changeWeek(1)">➡</button>

<div id="calendar"></div>

<h2>Återlämningar vald dag</h2>
<div id="returns"></div>

<h2>Aktiva bokningar</h2>
<div id="rentals"></div>

<script>

var inventory={
Knatte:{90:1,100:3,110:4,120:6},
Junior:{130:8,140:3,150:5,160:5},
Vuxen:{170:3,179:7,190:2,192:2,194:7,195:1,197:6,199:5,202:3,204:6,207:3}
}

var cart=[]
var rentals=[]
var weekOffset=0

function addSki(){

var cat=document.getElementById("category").value
var len=document.getElementById("length").value

cart.push({category:cat,length:len})

renderCart()

}

function renderCart(){

var div=document.getElementById("cart")

if(cart.length===0){
div.innerHTML=""
return
}

var html="<table><tr><th>Kategori</th><th>Längd</th></tr>"

cart.forEach(function(s){

html+="<tr><td>"+s.category+"</td><td>"+s.length+" cm</td></tr>"

})

html+="</table>"

div.innerHTML=html

}

function saveBooking(){

var name=document.getElementById("customer").value
var phone=document.getElementById("phone").value
var start=document.getElementById("start").value
var end=document.getElementById("end").value

if(!name||!start||!end||cart.length===0){

alert("Fyll i alla fält")
return

}

rentals.push({

name:name,
phone:phone,
start:start,
end:end,
returned:false,
items:JSON.parse(JSON.stringify(cart))

})

cart=[]

renderCart()
renderRentals()
renderWeek()

}

function returnBooking(i){

rentals[i].returned=true

renderRentals()
renderWeek()

}

function renderRentals(){

var div=document.getElementById("rentals")

div.innerHTML=""

rentals.forEach(function(r,i){

if(r.returned) return

var html="<div class='card'>"

html+="<strong>"+r.name+"</strong> "+r.phone+"<br>"
html+=r.start+" - "+r.end+"<br>"

r.items.forEach(function(it){

html+=it.category+" "+it.length+" cm<br>"

})

html+="<button onclick='returnBooking("+i+")'>Återlämnad</button>"

html+="</div>"

div.innerHTML+=html

})

}

function showReturns(day){

var div=document.getElementById("returns")

div.innerHTML="<strong>"+day+"</strong><br>"

rentals.forEach(function(r){

if(r.end===day && !r.returned){

div.innerHTML+=r.name+" "+r.phone+"<br>"

}

})

}

function monday(d){

d=new Date(d)

var day=d.getDay()
var diff=d.getDate()-(day===0?6:day-1)

return new Date(d.setDate(diff))

}

function format(d){

return d.toISOString().split("T")[0]

}

function changeWeek(n){

weekOffset+=n
renderWeek()

}

function renderWeek(){

var base=monday(new Date())

base.setDate(base.getDate()+weekOffset*7)

var dates=[]

for(var i=0;i<7;i++){

var d=new Date(base)
d.setDate(base.getDate()+i)

dates.push(format(d))

}

document.getElementById("weeklabel").innerHTML=
dates[0]+" - "+dates[6]

var html=""

for(var cat in inventory){

html+="<table><tr><th>"+cat+"</th>"

dates.forEach(function(d){

html+="<th class='day' onclick='showReturns(\""+d+"\")'>"+d.substring(5)+"</th>"

})

html+="</tr>"

for(var len in inventory[cat]){

var total=inventory[cat][len]

html+="<tr><td>"+len+"</td>"

dates.forEach(function(day){

var booked=0
var returning=false

rentals.forEach(function(r){

if(r.returned) return

if(day>=r.start && day<=r.end){

r.items.forEach(function(it){

if(it.category===cat && it.length==len){
booked++
}

})

}

if(day===r.end){
returning=true
}

})

var free=total-booked

var css="good"

if(returning) css="return"
else if(free===0) css="full"
else if(free<=Math.ceil(total/2)) css="low"

html+="<td class='"+css+"'>"+free+"</td>"

})

html+="</tr>"

}

html+="</table><br>"

}

document.getElementById("calendar").innerHTML=html

}

renderWeek()

</script>

</body>
</html>
