<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">

<title>Skiduthyrning</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{margin:0;font-family:-apple-system;background:#f5f5f5}
.container{display:flex;height:100vh;padding:8px;gap:8px}
.left{width:35%;display:flex;flex-direction:column;gap:8px}
.right{width:65%;display:flex;flex-direction:column;gap:8px}

.section{background:white;padding:10px;border-radius:10px;display:flex;flex-direction:column}

.scroll{overflow:auto}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.card{border:1px solid #ccc;padding:6px;border-radius:8px;text-align:center}

button{margin:2px;padding:6px;border:none;border-radius:6px;background:#2e7dff;color:white}

</style>

</head>

<body>

<div class="container">

<div class="left">

<div class="section">
<h4>Kund</h4>
<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">
<input type="date" id="start">
<input type="date" id="end">
</div>

<div class="section">
<h4>Bokningar</h4>
<input id="search" placeholder="Sök..." oninput="filterRentals()">
<div id="rentals" class="scroll"></div>
</div>

</div>

<div class="right">

<div class="section">

<h4>Utrustning</h4>

<div>
<button onclick="setType('langd')">🎿</button>
<button onclick="setType('skin')">🟢</button>
<button onclick="setType('tur')">🟠</button>
<button onclick="setType('slalom')">⛷️</button>
<button onclick="setType('pjaxa')">👢</button>
<button onclick="setType('stav')">🥢</button>
<button onclick="setType('hjalm')">🪖</button>
<button onclick="setType('pulka')">🛷</button>
</div>

<div id="skiWall" class="grid scroll"></div>

<div id="cart"></div>

<button id="saveBtn">Spara</button>
<button onclick="clearForm()">Rensa</button>

</div>

<div class="section">
<h4>Kalender</h4>
<button onclick="prevWeek()">←</button>
<button onclick="nextWeek()">→</button>
<div id="calendar"></div>
</div>

</div>

</div>

<script src="/app.js"></script>

</body>
</html>
