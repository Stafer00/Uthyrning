<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kalender PRO</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{
  margin:0;
  font-family:-apple-system;
  background:#f5f5f5;
}

.container{
  padding:10px;
}

.section{
  background:white;
  padding:12px;
  border-radius:12px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

button{
  padding:8px;
  margin:4px;
  border:none;
  border-radius:6px;
  background:#2e7dff;
  color:white;
  cursor:pointer;
}

.nav-buttons{
  margin-bottom:8px;
}

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

td, th{
  text-align:center;
  padding:6px;
  font-size:12px;
}

.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:flex;
  justify-content:center;
  align-items:center;
}

.popup-box{
  background:white;
  padding:16px;
  border-radius:10px;
  width:90%;
  max-width:420px;
  max-height:80%;
  overflow:auto;
}

</style>

</head>

<body>

<div class="container">

<div class="section">

  <!-- HEADER -->
  <div class="header">
    <h2>📅 Kalender</h2>
    <button onclick="window.location.href='index.html'">← Bokning</button>
  </div>

  <!-- NAV -->
  <div class="nav-buttons">
    <button onclick="prevWeek()">← Föregående vecka</button>
    <button onclick="nextWeek()">Nästa vecka →</button>
  </div>

  <!-- CALENDAR -->
  <div id="calendar"></div>

</div>

</div>

<script src="calendar.js"></script>

</body>
</html>
