<!DOCTYPE html>
<html lang="sv">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning</title>

<!-- 🚫 STOPPA CACHE -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- 🎨 PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d6cdf">

<!-- 📱 iPad / iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skidor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- CSS -->
<link rel="stylesheet" href="style.css?v=5">

<!-- Supabase -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</head>

<body>

<h1>Skiduthyrning</h1>

<h2>Ny bokning</h2>

<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">

<label>Start</label>
<input type="date" id="start">

<label>Slut</label>
<input type="date" id="end">

<h2>Skidor</h2>

<div id="skiWall"></div>

<h3>Valda skidor</h3>

<div id="cart"></div>

<button id="saveBtn">Spara bokning</button>

<h2>Aktiva bokningar</h2>

<div id="rentals"></div>

<!-- 🚀 LADDAR ALLTID SENASTE JS -->
<script>
fetch("app.js?v=" + Date.now())
.then(r => r.text())
.then(code => {
    console.log("Laddar app.js")
    eval(code)
})
.catch(err => {
    alert("Fel att ladda app.js: " + err)
})
</script>

<!-- ⚙️ SERVICE WORKER -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js")
    .then(() => console.log("SW registrerad"))
    .catch(err => console.log("SW fel:", err))
}
</script>

</body>

</html>
