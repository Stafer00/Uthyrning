<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">

<title>Skiduthyrning</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{
  margin:0;
  font-family:-apple-system, Arial;
  background:#f5f5f5;
  height:100vh;
  overflow:hidden;
}

.container{
  display:flex;
  height:100vh;
  gap:8px;
  padding:8px;
  box-sizing:border-box;
}

.left{
  width:35%;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.right{
  width:65%;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.section{
  background:white;
  border-radius:10px;
  padding:10px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.customer{flex:0 0 auto;}
.bookings{flex:1;}
.equipment{flex:2;}
.calendar{flex:1;}

input{
  font-size:14px;
  padding:8px;
  margin:3px 0;
  width:100%;
  border-radius:6px;
  border:1px solid #ccc;
}

button{
  font-size:14px;
  padding:6px 8px;
  margin:2px;
  border:none;
  border-radius:6px;
  background:#2e7dff;
  color:white;
}

.clearBtn{background:#777;}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.scroll{
  overflow:auto;
  flex:1;
  min-height:0;
}

.card{
  border:1px solid #ddd;
  border-radius:8px;
  padding:6px;
  text-align:center;
  font-size:12px;
}

#calendar table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}

#calendar td{
  text-align:center;
}

</style>

</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="left">

    <!-- KUND -->
    <div class="section customer">
      <h4>Kund</h4>
      <input id="customer" placeholder="Namn">
      <input id="phone" placeholder="Telefon">
      <input type="date" id="start">
      <input type="date" id="end">
    </div>

    <!-- BOKNINGAR -->
    <div class="section bookings">
      <h4>Bokningar</h4>
      <input id="search" placeholder="Sök..." oninput="filterRentals()">

      <div class="scroll">
        <div id="rentals"></div>
      </div>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="right">

    <!-- UTRUSTNING -->
    <div class="section equipment">

      <h4>Utrustning</h4>

      <div>
        <button onclick="addLangdPackage()">🎿 Längdpaket</button>
        <button onclick="addSlalomPackage()">⛷️ Slalompaket</button>
      </div>

      <div class="scroll">
        <div id="skiWall" class="grid"></div>
        <div id="cart"></div>
      </div>

      <div>
        <button id="saveBtn">Spara</button>
        <button onclick="clearForm()" class="clearBtn">Rensa</button>
        <button onclick="location.href='/lager.html'">Lager</button>
      </div>

    </div>

    <!-- KALENDER -->
    <div class="section calendar">
      <h4>Kalender</h4>

      <div>
        <button onclick="prevWeek()">←</button>
        <button onclick="nextWeek()">→</button>
      </div>

      <div id="calendar"></div>
    </div>

  </div>

</div>

<script src="/app.js"></script>

</body>
</html>
