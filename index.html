<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning</title>

<!-- STOPPA CACHE -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>

body{
  font-family:-apple-system, Arial;
  margin:0;
  padding:10px;
  background:#f5f5f5;
}

/* SECTIONS */
.section{
  background:white;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
}

/* INPUT */
input{
  font-size:18px;
  padding:12px;
  margin:6px 0;
  width:100%;
  border-radius:10px;
  border:1px solid #ccc;
}

/* BUTTON */
button{
  font-size:16px;
  padding:10px;
  margin:5px;
  border-radius:10px;
  border:none;
  background:#2e7dff;
  color:white;
}

/* SPECIAL KNAPPAR */
.clearBtn{
  background:#777;
}

.saveBtn{
  background:#2e7dff;
}

/* GRID – 5 KOLUMNER */
.grid{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:8px;
}

/* SKIDKORT */
.card{
  border:1px solid #ddd;
  border-radius:12px;
  padding:8px;
  text-align:center;
  font-size:13px;
}

/* KALENDER */
#calendar table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

#calendar th, #calendar td{
  padding:6px;
  font-size:12px;
  text-align:center;
}

/* RUBRIKER */
h3, h4{
  margin:5px 0;
}

</style>

<!-- SUPABASE -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</head>

<body>

<h3>Skiduthyrning</h3>

<!-- KUND -->
<div class="section">

<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">

<label>Start</label>
<input type="date" id="start">

<label>Slut</label>
<input type="date" id="end">

</div>

<!-- SKIDOR -->
<div class="section">

<h4>Välj skidor</h4>

<div id="skiWall" class="grid"></div>

<h4>Valda</h4>
<div id="cart"></div>

<button id="saveBtn" class="saveBtn">Spara bokning</button>
<button onclick="clearForm()" class="clearBtn">Rensa</button>

</div>

<!-- KALENDER -->
<div class="section">

<h4>Kalender</h4>

<button onclick="prevWeek()">←</button>
<button onclick="nextWeek()">→</button>

<div id="calendar"></div>

</div>

<!-- BOKNINGAR -->
<div class="section">

<h4>Bokningar</h4>

<div id="rentals"></div>

</div>

<!-- 🔥 RENSAR SERVICE WORKER -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister())
  })
}
</script>

<!-- 🔥 CACHE-KILL -->
<script>
const script = document.createElement("script")
script.src = "/app.js?v=" + Date.now()
document.body.appendChild(script)

if (!sessionStorage.getItem("reloaded")) {
  sessionStorage.setItem("reloaded", "true")
  location.reload()
}
</script>

</body>
</html>
