<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning PRO</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#f5f5f5;
}

.main{
  display:grid;
  grid-template-columns:320px 1fr;
  gap:10px;
  padding:10px;
}

.section{
  background:white;
  padding:12px;
  border-radius:12px;
}

.hidden{display:none}

button{
  padding:8px;
  margin:4px;
  border:none;
  border-radius:6px;
  background:#2e7dff;
  color:white;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:6px;
}

.card{
  text-align:center;
  padding:6px;
  border-radius:8px;
}

input{
  width:100%;
  padding:6px;
  margin-bottom:6px;
}

@media(max-width:800px){
  .main{grid-template-columns:1fr}
}
</style>

</head>

<body>

<!-- NAV -->
<div style="padding:10px">
  <button onclick="showView('booking')">📋 Bokning</button>
  <button onclick="showView('calendar')">📅 Kalender</button>
</div>

<!-- BOOKING VIEW -->
<div id="bookingView" class="main">

  <div>
    <div class="section">
      <h3>Kund</h3>
      <input id="customer" placeholder="Namn">
      <input id="phone" placeholder="Telefon">
      <input id="start" type="date">
      <input id="end" type="date">
    </div>

    <div class="section">
      <h3>Bokningar</h3>
      <div id="rentals"></div>
    </div>
  </div>

  <div>
    <div class="section">
      <h3>Utrustning</h3>
      <div id="skiWall"></div>
    </div>

    <div class="section">
      <h3>Val</h3>
      <div id="cart"></div>
      <button id="saveBtn">Spara bokning</button>
    </div>
  </div>

</div>

<!-- CALENDAR VIEW -->
<div id="calendarView" class="section hidden" style="margin:10px">

  <h3>📅 Kalender</h3>

  <button onclick="prevWeek()">←</button>
  <button onclick="nextWeek()">→</button>

  <div id="calendar"></div>

</div>

<script src="app.js"></script>

</body>
</html>
