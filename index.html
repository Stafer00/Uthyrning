<div class="container">

  <!-- VÄNSTER (MINDRE) -->
  <div class="left">

    <div class="section customer">
      <h4>Kund</h4>
      <input id="customer" placeholder="Namn">
      <input id="phone" placeholder="Telefon">
      <input type="date" id="start">
      <input type="date" id="end">
    </div>

    <div class="section skiSection">

      <h4>Skidor</h4>

      <div style="display:flex; flex-direction:column; flex:1; min-height:0;">

        <div class="scroll">
          <div id="skiWall" class="grid"></div>
          <div id="cart"></div>
        </div>

        <div style="flex:0 0 auto; display:flex; gap:6px;">
          <button id="saveBtn">Spara</button>
          <button onclick="clearForm()" class="clearBtn">Rensa</button>
          <button onclick="location.href='lager.html'">Lager</button>
        </div>

      </div>

    </div>

  </div>

  <!-- HÖGER (STÖRRE) -->
  <div class="right" style="flex:2;">

    <div class="section calendar" style="flex:2;">

      <h4>Kalender</h4>

      <div>
        <button onclick="prevWeek()">←</button>
        <button onclick="nextWeek()">→</button>
      </div>

      <div id="calendar"></div>

    </div>

    <div class="section bookings" style="flex:1;">

      <h4>Bokningar</h4>
      <input id="search" placeholder="Sök..." oninput="filterRentals()">

      <div class="scroll">
        <div id="rentals"></div>
      </div>

    </div>

  </div>

</div>
