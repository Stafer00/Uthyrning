<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<link rel="stylesheet" href="style.css?v=5000">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="container">

<h1>Skiduthyrning</h1>

<h2>Ny bokning</h2>

<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">

<label>Start</label>
<input type="date" id="start">

<label>Slut</label>
<input type="date" id="end">

<h2>Skidor</h2>
<div id="skiWall"></div>

<h3>Valda skidor</h3>
<div id="cart"></div>

<button id="saveBtn">Spara bokning</button>

<h2>Kalender</h2>

<div>
<button onclick="prevWeek()">←</button>
<button onclick="nextWeek()">→</button>
</div>

<!-- 🔥 VIKTIG -->
<div id="calendar"></div>

<h2>Aktiva bokningar</h2>
<div id="rentals"></div>

</div>

<script src="app.js?v=5000"></script>

</body>
</html>
