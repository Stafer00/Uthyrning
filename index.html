<!DOCTYPE html>

<head>

<body>

<!-- 🚀 LADDAR ALLTID NYASTE app.js -->
<script>
fetch("app.js?v=" + Date.now())
.then(r => r.text())
.then(code => {
    console.log("Laddar app.js...");

})
.catch(err => {
    alert("Fel att ladda app.js: " + err);
});
