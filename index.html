<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<style>

body {
  font-family: -apple-system, Arial;
  padding: 20px;
  background: #f5f5f5;
}

h1 { font-size: 34px; }

.section {
  background: white;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 20px;
}

input, select, button {
  font-size: 18px;
  padding: 14px;
  margin: 5px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
  width: 100%;
}

button {
  background: #2e7dff;
  color: white;
  border: none;
}

.small-btn {
  width: auto;
  padding: 10px 14px;
}

#inventorySection {
  display: none;
}

table {
  width: 100%;
  border-collapse: collapse;
}

td, th {
  padding: 6px;
  text-align: center;
}

</style>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</head>

<body>

<h1>Skiduthyrning</h1>

<!-- ========= BOKNING ========= -->
<div class="section">

<h2>Ny bokning</h2>

<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">

<label>Start</label>
<input type="date" id="start">

<label>Slut</label>
<input type="date" id="end">

</div>

<!-- ========= SKIDOR ========= -->
<div class="section">

<h2>Välj skidor</h2>
<div id="skiWall"></div>

<h3>Valda skidor</h3>
<div id="cart">Inga skidor</div>

<button id="saveBtn">Spara bokning</button>

</div>

<!-- ========= KALENDER ========= -->
<div class="section">

<h2>Kalender</h2>

<div style="display:flex; gap:10px;">
  <button onclick="prevWeek()">←</button>
  <button onclick="nextWeek()">→</button>
</div>

<br>

<div id="calendar"></div>

</div>

<!-- ========= BOKNINGAR ========= -->
<div class="section">

<h2>Aktiva bokningar</h2>
<div id="rentals"></div>

</div>

<!-- ========= LAGER ========= -->
<div class="section">

<button class="small-btn" onclick="toggleInventory()">
⚙️ Lagerhantering
</button>

<div id="inventorySection">
  <h2>Lager</h2>
  <div id="inventory"></div>
</div>

</div>

<script>
function toggleInventory(){
  const div = document.getElementById("inventorySection")
  div.style.display = div.style.display === "none" ? "block" : "none"
}
</script>

<script src="/app.js?v=12000"></script>

</body>
</html>
