
<!DOCTYPE html>
<html lang="sv">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skiduthyrning</title>

<style>
body{font-family:Arial;padding:20px;background:#f4f4f4}
h1{text-align:center}
input,select,button{padding:8px;margin:4px 0;width:100%}
button{background:#1976d2;color:white;border:none;border-radius:6px}

table{border-collapse:collapse;width:100%;margin-top:10px}
th,td{border:1px solid #ccc;padding:5px;text-align:center}

.card{background:white;padding:10px;margin:10px 0;border-radius:6px}
</style>
</head>

<body>

<h1>Skiduthyrning</h1>

<h2>Ny bokning</h2>

<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">

<select id="category"></select>
<select id="length"></select>

<button onclick="addItem()">Lägg till skidor</button>

<div id="cart"></div>

<h2>Aktiva bokningar</h2>
<div id="rentals"></div>

<script>

var categories=["Knatte","Junior","Vuxen"]

var inventory={
Knatte:[[90,1],[100,3],[110,4],[120,6]],
Junior:[[130,8],[140,3],[150,5],[160,5]],
Vuxen:[[170,3],[179,7],[190,2],[192,2],[194,7],[195,1],[197,6],[199,5],[202,3],[204,6],[207,3]]
}

var cart=[]

function init(){

var cat=document.getElementById("category")

categories.forEach(function(c){

var o=document.createElement("option")
o.value=c
o.text=c

cat.appendChild(o)

})

cat.onchange=loadLengths

loadLengths()

}

function loadLengths(){

var cat=document.getElementById("category").value

var sel=document.getElementById("length")

sel.innerHTML=""

inventory[cat].forEach(function(i){

var o=document.createElement("option")

o.value=i[0]
o.text=i[0]+" cm"

sel.appendChild(o)

})

}

function addItem(){

var cat=document.getElementById("category").value
var len=document.getElementById("length").value

cart.push({category:cat,length:len})

renderCart()

}

function renderCart(){

var div=document.getElementById("cart")

if(cart.length==0){
div.innerHTML=""
return
}

var html="<table><tr><th>Kategori</th><th>Längd</th></tr>"

cart.forEach(function(i){

html+="<tr><td>"+i.category+"</td><td>"+i.length+"</td></tr>"

})

html+="</table>"

div.innerHTML=html

}

init()

</script>

</body>
</html>
