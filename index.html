<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning PRO</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{font-family:sans-serif;background:#f5f5f5;margin:0}
.container{padding:10px}
.section{background:white;padding:12px;border-radius:10px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}
.card{text-align:center;padding:6px;border-radius:8px}
button{padding:6px 10px;margin:2px;background:#2e7dff;color:white;border:none;border-radius:6px}
.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;justify-content:center;align-items:center}
.popup-box{background:white;padding:20px;border-radius:10px}
</style>

</head>

<body>

<div class="container">

<div class="section">
<h3>Kund</h3>
<input id="customer" placeholder="Namn"><br>
<input id="phone" placeholder="Telefon"><br>
<input id="start" type="date"><br>
<input id="end" type="date"><br>
<button id="saveBtn">Spara bokning</button>
</div>

<div class="section">
<h3>Utrustning</h3>
<div id="skiWall"></div>
</div>

<div class="section">
<h3>Val</h3>
<div id="cart"></div>
<div id="total"></div>
</div>

<div class="section">
<h3>Bokningar</h3>
<div id="rentals"></div>
</div>

<div class="section">
<h3>Kalender</h3>
<div id="calendar"></div>
</div>

</div>

<script src="app.js"></script>

</body>
</html>
