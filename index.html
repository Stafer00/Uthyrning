<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skiduthyrning PRO</title>

<style>
body{font-family:Arial;padding:20px;background:#f4f4f4}
h1{text-align:center}

input,select,button{
padding:8px;
margin:4px 0;
width:100%
}

button{
background:#1976d2;
color:white;
border:none;
border-radius:6px
}

table{
border-collapse:collapse;
width:100%;
margin-top:10px;
font-size:12px
}

th,td{
border:1px solid #ccc;
padding:5px;
text-align:center
}

.card{
background:white;
padding:10px;
margin:10px 0;
border-radius:6px
}

.section{
background:white;
padding:10px;
margin-top:15px;
border-radius:6px
}

.good{background:#4caf50;color:white}
.low{background:#ff9800;color:white}
.full{background:#f44336;color:white}

.daylink{cursor:pointer;text-decoration:underline}

</style>
</head>

<body>

<h1>Skiduthyrning</h1>

<h2>Ny bokning</h2>

<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">

<label>Startdatum</label>
<input type="date" id="start">

<label>Slutdatum</label>
<input type="date" id="end">

<select id="category"></select>
<select id="length"></select>

<button onclick="addItem()">Lägg till skidor</button>
<button onclick="saveBooking()">Spara bokning</button>

<div id="cart"></div>

<h2>Veckovy</h2>

<button onclick="changeWeek(-1)">⬅</button>
<span id="weeklabel"></span>
<button onclick="changeWeek(1)">➡</button>

<div id="calendar"></div>

<h2>Återlämningar vald dag</h2>
<div id="returns"></div>

<h2>Aktiva bokningar</h2>
<div id="rentals"></div>

<h2>Lager</h2>
<div id="inventory"></div>

<script>

"use strict";

var categories=["Knatte","Junior","Vuxen"]

var inventory={
Knatte:[[90,1],[100,3],[110,4],[120,6]],
Junior:[[130,8],[140,3],[150,5],[160,5]],
Vuxen:[[170,3],[179,7],[190,2],[192,2],[194,7],[195,1],[197,6],[199,5],[202,3],[204,6],[207,3]]
}

var cart=[]
var rentals=[]
var weekOffset=0

function saveData(){
localStorage.setItem("rentals",JSON.stringify(rentals))
localStorage.setItem("inventory",JSON.stringify(inventory))
}

function loadData(){

var r=localStorage.getItem("rentals")
var i=localStorage.getItem("inventory")

if(r) rentals=JSON.parse(r)
if(i) inventory=JSON.parse(i)

}

function init(){

loadData()

var cat=document.getElementById("category")

for(var i=0;i<categories.length;i++){
var o=document.createElement("option")
o.value=categories[i]
o.text=categories[i]
cat.appendChild(o)
}

cat.onchange=loadLengths

loadLengths()
renderWeek()
renderInventory()
renderRentals()

}

function loadLengths(){

var cat=document.getElementById("category").value
var sel=document.getElementById("length")

sel.innerHTML=""

var list=inventory[cat]

for(var i=0;i<list.length;i++){
var o=document.createElement("option")
o.value=list[i][0]
o.text=list[i][0]+" cm"
sel.appendChild(o)
}

}

function addItem(){

var cat=document.getElementById("category").value
var len=parseInt(document.getElementById("length").value)

cart.push({category:cat,length:len})

renderCart()

}

function renderCart(){

var div=document.getElementById("cart")

if(cart.length==0){
div.innerHTML=""
return
}

var html="<table><tr><th>Kategori</th><th>Längd</th></tr>"

for(var i=0;i<cart.length;i++){
html+="<tr><td>"+cart[i].category+"</td><td>"+cart[i].length+"</td></tr>"
}

html+="</table>"

div.innerHTML=html

}

function saveBooking(){

var name=document.getElementById("customer").value
var phone=document.getElementById("phone").value
var start=document.getElementById("start").value
var end=document.getElementById("end").value

if(!name||!start||!end||cart.length==0){
alert("Fyll i alla fält")
return
}

rentals.push({
name:name,
phone:phone,
start:start,
end:end,
returned:false,
items:JSON.parse(JSON.stringify(cart))
})

cart=[]
renderCart()

saveData()

renderRentals()
renderWeek()

}

function returnBooking(i){

rentals[i].returned=true

saveData()

renderRentals()
renderWeek()

}

function renderRentals(){

var div=document.getElementById("rentals")
div.innerHTML=""

for(var r=0;r<rentals.length;r++){

if(rentals[r].returned) continue

var html="<div class='card'>"

html+="<strong>"+rentals[r].name+"</strong> "+rentals[r].phone+"<br>"
html+=rentals[r].start+" - "+rentals[r].end+"<br>"

for(var i=0;i<rentals[r].items.length;i++){
var it=rentals[r].items[i]
html+=it.category+" "+it.length+" cm<br>"
}

html+="<button onclick='returnBooking("+r+")'>Återlämnad</button>"

html+="</div>"

div.innerHTML+=html

}

}

function showReturns(day){

var div=document.getElementById("returns")
div.innerHTML="<strong>"+day+"</strong><br>"

for(var i=0;i<rentals.length;i++){

if(rentals[i].end==day && !rentals[i].returned){

div.innerHTML+=rentals[i].name+" "+rentals[i].phone+"<br>"

}

}

}

function changeWeek(n){
weekOffset+=n
renderWeek()
}

function getMonday(d){

d=new Date(d)

var day=d.getDay()
var diff=d.getDate()-(day==0?6:day-1)

return new Date(d.setDate(diff))

}

function overlaps(a,b,c,d){
return (a<=d && c<=b)
}

function formatDate(d){

var y=d.getFullYear()
var m=("0"+(d.getMonth()+1)).slice(-2)
var da=("0"+d.getDate()).slice(-2)

return y+"-"+m+"-"+da

}

function renderWeek(){

var base=getMonday(new Date())
base.setDate(base.getDate()+weekOffset*7)

var end=new Date(base)
end.setDate(base.getDate()+6)

document.getElementById("weeklabel").innerHTML=
formatDate(base)+" - "+formatDate(end)

var dates=[]

for(var i=0;i<7;i++){
var d=new Date(base)
d.setDate(base.getDate()+i)
dates.push(formatDate(d))
}

var html=""

for(var c=0;c<categories.length;c++){

var cat=categories[c]

html+="<div class='section'><strong>"+cat+"</strong>"
html+="<table><tr><th>Längd</th>"

for(var d=0;d<dates.length;d++){
html+="<th class='daylink' onclick='showReturns(\""+dates[d]+"\")'>"+dates[d].substring(5)+"</th>"
}

html+="</tr>"

var rows=inventory[cat]

for(var r=0;r<rows.length;r++){

var len=rows[r][0]
var total=rows[r][1]

html+="<tr><td>"+len+"</td>"

for(var d=0;d<dates.length;d++){

var booked=0

for(var b=0;b<rentals.length;b++){

var booking=rentals[b]

if(booking.returned) continue

if(overlaps(dates[d],dates[d],booking.start,booking.end)){

for(var i=0;i<booking.items.length;i++){
var it=booking.items[i]
if(it.category==cat && it.length==len){
booked++
}
}

}

}

var available=total-booked

var css="good"
if(available==0) css="full"
else if(available<=Math.ceil(total/2)) css="low"

html+="<td class='"+css+"'>"+available+"</td>"

}

html+="</tr>"

}

html+="</table></div>"

}

document.getElementById("calendar").innerHTML=html

}

function renderInventory(){

var div=document.getElementById("inventory")
div.innerHTML=""

for(var c=0;c<categories.length;c++){

var cat=categories[c]

div.innerHTML+="<strong>"+cat+"</strong><br>"

var rows=inventory[cat]

for(var r=0;r<rows.length;r++){
div.innerHTML+=rows[r][0]+" cm <input type='number' value='"+rows[r][1]+"' onchange='updateInventory(\""+cat+"\","+r+",this.value)'><br>"
}

div.innerHTML+="<br>"

}

}

function updateInventory(cat,row,val){

inventory[cat][row][1]=parseInt(val)

saveData()

renderWeek()

}

window.onload = init;

</script>

</body>
</html>
