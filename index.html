<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning PRO</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

body{
  margin:0;
  font-family:-apple-system;
  background:#f5f5f5;
}

/* LAYOUT */
.main{
  display:grid;
  grid-template-columns: 320px 1fr;
  gap:10px;
  padding:10px;
}

.section{
  background:white;
  padding:12px;
  border-radius:12px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:6px;
}

.card{
  text-align:center;
  padding:6px;
  border-radius:8px;
}

/* BUTTON */
button{
  padding:8px;
  margin:4px;
  border:none;
  border-radius:6px;
  background:#2e7dff;
  color:white;
  cursor:pointer;
}

/* LEFT PANEL */
.left{
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* RIGHT PANEL */
.right{
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* INPUT */
input{
  width:100%;
  padding:6px;
  margin-bottom:6px;
  border-radius:6px;
  border:1px solid #ccc;
}

/* MOBILE */
@media(max-width:800px){
  .main{
    grid-template-columns:1fr;
  }
}

</style>

</head>

<body>

<div class="main">

  <!-- LEFT -->
  <div class="left">

    <!-- KUND -->
    <div class="section">
      <h3>Kund</h3>
      <input id="customer" placeholder="Namn">
      <input id="phone" placeholder="Telefon">
      <input id="start" type="date">
      <input id="end" type="date">
    </div>

    <!-- BOKNINGAR -->
    <div class="section">
      <h3>Bokningar</h3>
      <div id="rentals"></div>
    </div>

    <!-- NAV -->
    <div class="section">
      <button onclick="window.location.href='calendar.html'">📅 Kalender</button>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="right">

    <!-- UTRUSTNING -->
    <div class="section">
      <h3>Utrustning</h3>
      <div id="skiWall"></div>
    </div>

    <!-- VAL -->
    <div class="section">
      <h3>Val</h3>
      <div id="cart"></div>
      <div id="total"></div>

      <button id="saveBtn">Spara bokning</button>
      <button onclick="cart=[];render()">Rensa</button>
    </div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
