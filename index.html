<!DOCTYPE html>
<html lang="sv">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skiduthyrning Pro</title>
<style>
body { font-family: Arial; padding:20px; background:#f4f4f4; }
h1 { text-align:center; }
h2 { margin-top:30px; }
input, select, button { padding:10px; font-size:14px; margin:5px 0; width:100%; }
button { background:#1976d2; color:white; border:none; border-radius:6px; }
.smallbtn { width:auto; margin:5px; padding:8px 12px; }
table { border-collapse: collapse; width:100%; margin-top:15px; }
th, td { border:1px solid #ccc; padding:8px; text-align:center; }
th { background:#eee; }
.low { background:#ff9800; color:white; }
.full { background:#f44336; color:white; }
.good { background:#4caf50; color:white; }
.controls { text-align:center; margin-top:10px; }
.card { background:white; padding:10px; margin:8px 0; border-radius:6px; }
</style>
</head>
<body>

<h1>Skiduthyrning</h1>

<h2>Ny bokning</h2>
<input id="customer" placeholder="Kundnamn">
<select id="category">
<option>Knatte</option>
<option>Junior</option>
<option>Vuxen</option>
</select>
<select id="length"></select>
<label>Startdatum</label>
<input type="date" id="start">
<label>Slutdatum</label>
<input type="date" id="end">
<button onclick="rent()">Boka</button>

<h2>Aktiva bokningar</h2>
<div id="rentals"></div>

<h2>Veckotillgänglighet</h2>

<div class="controls">
<button class="smallbtn" onclick="changeWeek(-1)">⬅</button>
<strong id="weekLabel"></strong>
<button class="smallbtn" onclick="changeWeek(1)">➡</button>
<br>
<button class="smallbtn" onclick="jumpToSportlov()">Sportlov</button>
<button class="smallbtn" onclick="jumpToPask()">Påsk</button>
</div>

<div id="tableContainer"></div>

<script>

const inventory = {
90:1,100:3,110:4,120:6,130:8,140:3,150:5,160:5,170:3,
179:7,190:2,192:2,194:7,195:1,197:6,199:5,202:3,204:6,207:3
};

if(!localStorage.rentals){
  localStorage.rentals = JSON.stringify([]);
}

let currentMonday = getMonday(new Date());

function getMonday(d){
  d = new Date(d);
  let day = d.getDay();
  let diff = d.getDate() - (day === 0 ? 6 : day - 1);
  return new Date(d.setDate(diff));
}

function formatDate(d){
  return d.toISOString().split("T")[0];
}

function overlaps(aStart,aEnd,bStart,bEnd){
  return (aStart<=bEnd && bStart<=aEnd);
}

function calculatePrice(cat, days){
  const table = {
    Knatte:[140,220,290,340,380,420,420],
    Junior:[200,290,360,430,500,530,530],
    Vuxen:[280,380,470,550,610,680,680]
  };
  const extra = {Knatte:60, Junior:70, Vuxen:90};
  if(days<=7) return table[cat][days-1];
  return table[cat][6] + (days-7)*extra[cat];
}

function daysBetween(start,end){
  return Math.ceil((new Date(end)-new Date(start))/(1000*60*60*24))+1;
}

function loadInventory(){
  let select=document.getElementById("length");
  select.innerHTML="";
  Object.keys(inventory).sort((a,b)=>a-b).forEach(len=>{
    let opt=document.createElement("option");
    opt.value=len;
    opt.text=len+" cm";
    select.appendChild(opt);
  });
}

function rent(){
  let customer=document.getElementById("customer").value;
  let category=document.getElementById("category").value;
  let length=document.getElementById("length").value;
  let start=document.getElementById("start").value;
  let end=document.getElementById("end").value;

  if(!customer||!start||!end) return alert("Fyll i alla fält");
  if(end<start) return alert("Slutdatum måste vara efter startdatum");

  let rentals=JSON.parse(localStorage.rentals);

  let booked=rentals.filter(r=>
    !r.returned &&
    r.length==length &&
    overlaps(start,end,r.start,r.end)
  ).length;

  if(booked>=inventory[length]){
    return alert("Fullbokat denna period");
  }

  let days=daysBetween(start,end);
  let price=calculatePrice(category,days);

  rentals.push({
    id:Date.now(),
    customer,category,length,start,end,price,returned:false
  });

  localStorage.rentals=JSON.stringify(rentals);
  document.getElementById("customer").value="";
  loadRentals();
  renderWeek();
}

function markReturned(id){
  let rentals=JSON.parse(localStorage.rentals);
  let item=rentals.find(r=>r.id===id);
  item.returned=true;
  localStorage.rentals=JSON.stringify(rentals);
  loadRentals();
  renderWeek();
}

function loadRentals(){
  let rentals=JSON.parse(localStorage.rentals);
  let div=document.getElementById("rentals");
  div.innerHTML="";
  rentals.filter(r=>!r.returned).forEach(r=>{
    div.innerHTML+=`
    <div class="card">
      <strong>${r.customer}</strong><br>
      ${r.length} cm<br>
      ${r.start} – ${r.end}<br>
      ${r.price} kr
      <button onclick="markReturned(${r.id})">Återlämnad</button>
    </div>`;
  });
}

function renderWeek(){
  let monday = new Date(currentMonday);
  let sunday = new Date(monday);
  sunday.setDate(sunday.getDate()+6);

  document.getElementById("weekLabel").innerText =
    formatDate(monday) + " – " + formatDate(sunday);

  let rentals = JSON.parse(localStorage.rentals);
  let html = "<table><tr><th>Längd</th><th>Lediga denna vecka</th></tr>";

  Object.keys(inventory).sort((a,b)=>a-b).forEach(len=>{

    let minAvailable = inventory[len];

    for(let i=0;i<7;i++){
      let day = new Date(monday);
      day.setDate(day.getDate()+i);
      let dateStr = formatDate(day);

      let booked = rentals.filter(r=>
        !r.returned &&
        r.length==len &&
        overlaps(dateStr,dateStr,r.start,r.end)
      ).length;

      let available = inventory[len] - booked;
      if(available < minAvailable){
        minAvailable = available;
      }
    }

    let total = inventory[len];
    let cssClass = "good";
    if(minAvailable === 0) cssClass = "full";
    else if(minAvailable <= Math.ceil(total/2)) cssClass = "low";

    html += "<tr>";
    html += "<td>"+len+" cm</td>";
    html += "<td class='"+cssClass+"'>"+minAvailable+" / "+total+"</td>";
    html += "</tr>";
  });

  html += "</table>";
  document.getElementById("tableContainer").innerHTML = html;
}

function changeWeek(direction){
  currentMonday.setDate(currentMonday.getDate() + (7 * direction));
  renderWeek();
}

function jumpToSportlov(){
  let year = new Date().getFullYear();
  let approx = new Date(year,1,28);
  currentMonday = getMonday(approx);
  renderWeek();
}

function jumpToPask(){
  let year = new Date().getFullYear();
  let approx = new Date(year,3,5);
  currentMonday = getMonday(approx);
  renderWeek();
}

loadInventory();
loadRentals();
renderWeek();

</script>
</body>
</html>
