<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning</title>

<!-- 🔥 STOPPA CACHE -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
body{
  font-family:-apple-system, Arial;
  padding:15px;
  background:#f5f5f5;
}

h2{
  margin-bottom:10px;
}

.section{
  background:white;
  padding:12px;
  border-radius:12px;
  margin-bottom:15px;
}

input{
  font-size:18px;
  padding:12px;
  margin:6px 0;
  width:100%;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  font-size:18px;
  padding:12px;
  margin:5px;
  border-radius:10px;
  border:none;
  background:#2e7dff;
  color:white;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.card{
  border:1px solid #ccc;
  padding:10px;
  border-radius:10px;
  text-align:center;
}

#calendar table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

#calendar th, #calendar td{
  padding:6px;
  text-align:center;
  font-size:14px;
}

</style>

<!-- 🔥 SUPABASE -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</head>

<body>

<h2>Skiduthyrning</h2>

<!-- ========= BOKNING ========= -->
<div class="section">

<input id="customer" placeholder="Namn">
<input id="phone" placeholder="Telefon">

<label>Start</label>
<input type="date" id="start">

<label>Slut</label>
<input type="date" id="end">

</div>

<!-- ========= SKIDOR ========= -->
<div class="section">

<h3>Välj skidor</h3>
<div id="skiWall" class="grid"></div>

<h3>Valda skidor</h3>
<div id="cart"></div>

<button id="saveBtn">Spara bokning</button>

</div>

<!-- ========= KALENDER ========= -->
<div class="section">

<h3>Kalender</h3>

<div style="display:flex;gap:10px;">
  <button onclick="prevWeek()">←</button>
  <button onclick="nextWeek()">→</button>
</div>

<div id="calendar"></div>

</div>

<!-- ========= BOKNINGAR ========= -->
<div class="section">

<h3>Aktiva bokningar</h3>
<div id="rentals"></div>

</div>

<!-- 🔥 RENSAR GAMLA SERVICE WORKERS -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister())
  })
}
</script>

<!-- 🔥 LADDAR ALLTID SENASTE app.js -->
<script>
const script = document.createElement("script")
script.src = "/app.js?v=" + Date.now()
document.body.appendChild(script)
</script>

</body>
</html>
