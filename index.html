<!DOCTYPE html>
<html lang="sv">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Skiduthyrning</title>

<meta http-equiv="Cache-Control" content="no-cache">

<style>

/* BAS */
body{
  margin:0;
  font-family:-apple-system, Arial;
  background:#f5f5f5;
  height:100vh;
}

/* LAYOUT */
.container{
  display:flex;
  height:100vh;
  gap:8px;
  padding:8px;
  box-sizing:border-box;
}

/* KOLUMNER */
.left{
  width:35%;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.right{
  width:65%;
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* SECTIONS */
.section{
  background:white;
  border-radius:10px;
  padding:8px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* FLEX */
.customer{flex:0 0 auto;}
.skiSection{flex:1;}
.calendar{flex:2;}
.bookings{flex:1;}

/* INPUT */
input{
  font-size:14px;
  padding:8px;
  margin:3px 0;
  width:100%;
  border-radius:6px;
  border:1px solid #ccc;
}

/* BUTTON */
button{
  font-size:14px;
  padding:6px;
  margin:2px;
  border:none;
  border-radius:6px;
  background:#2e7dff;
  color:white;
}

/* SPECIAL */
.clearBtn{background:#777;}
.lagerBtn{background:#4caf50;}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

/* SCROLL */
.scroll{
  overflow:auto;
  flex:1;
  min-height:0;
}

/* CARD */
.card{
  border:1px solid #ddd;
  border-radius:8px;
  padding:6px;
  text-align:center;
  font-size:12px;
}

/* KALENDER */
#calendar table{
  width:100%;
  height:100%;
  border-collapse:collapse;
  font-size:11px;
}

#calendar td{
  text-align:center;
  color:white;
}

/* RUBRIKER */
h4{
  margin:4px 0;
}

</style>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="container">

  <!-- VÄNSTER -->
  <div class="left">

    <!-- KUND -->
    <div class="section customer">

      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h4>Kund</h4>
        <button class="lagerBtn" onclick="window.location.href='/lager.html'">
          Lager
        </button>
      </div>

      <input id="customer" placeholder="Namn">
      <input id="phone" placeholder="Telefon">
      <input type="date" id="start">
      <input type="date" id="end">

    </div>

    <!-- SKIDOR -->
    <div class="section skiSection">

      <h4>Skidor</h4>

      <div class="scroll">
        <div id="skiWall" class="grid"></div>
        <div id="cart"></div>
      </div>

      <!-- FASTA KNAPPAR -->
      <div style="flex:0 0 auto;">
        <button id="saveBtn">Spara</button>
        <button onclick="clearForm()" class="clearBtn">Rensa</button>
      </div>

    </div>

  </div>

  <!-- HÖGER -->
  <div class="right">

    <!-- KALENDER -->
    <div class="section calendar">

      <h4>Kalender</h4>

      <div>
        <button onclick="prevWeek()">←</button>
        <button onclick="nextWeek()">→</button>
      </div>

      <div id="calendar"></div>

    </div>

    <!-- BOKNINGAR -->
    <div class="section bookings">

      <h4>Bokningar</h4>

      <input id="search" placeholder="Sök..." oninput="filterRentals()">

      <div class="scroll">
        <div id="rentals"></div>
      </div>

    </div>

  </div>

</div>

<script src="/app.js"></script>

</body>
</html>
